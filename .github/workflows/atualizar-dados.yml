# Robô de dados do NEXUS HUB: busca notícias, calendário econômico global, bolsas e ETFs
# e publica os arquivos JSON no ramo "data" (o site lê de raw.githubusercontent.com).
# Se algo falhar, o site continua funcionando: ele busca direto nas fontes.
name: Atualizar dados

on:
  schedule:
    - cron: '7,27,47 * * * *'   # a cada ~20 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch: {}          # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar dados
        run: node scripts/atualizar-dados.mjs _data
      - name: Publicar no ramo data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _data
          git init -q
          git config user.name "nexus-hub-bot"
          git config user.email "nexus-hub-bot@users.noreply.github.com"
          git checkout -q -b data
          git add -A
          git commit -q -m "dados $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      - name: Manter o agendamento ativo
        # o GitHub desliga agendamentos após 60 dias sem commits no ramo principal
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ($(date +%s) - last) / 86400 ))
          echo "último commit no ramo principal há ${age} dias"
          if [ "$age" -ge 50 ]; then
            git config user.name "nexus-hub-bot"
            git config user.email "nexus-hub-bot@users.noreply.github.com"
            git commit -q --allow-empty -m "manter o robô de dados ativo"
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
          fi
