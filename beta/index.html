    const d = SRC[id], h = HEALTH[id];
    if (d._running || !d.need()) continue;
    if (!h.next || now >= h.next) runSource(id);
  }
}
function refreshStale() { // ao voltar para a aba: atualiza o que venceu
  const now = Date.now();
  for (const id in SRC) { const d = SRC[id], h = HEALTH[id]; if (d.need() && (!h.ts || now - h.ts > d.every)) runSource(id); }
}
function refreshAll() { for (const id in SRC) if (SRC[id].need()) runSource(id, { force: true }); }

// ---------- selos de procedência ----------
// <span class="stamp" data-src="id"> é atualizado sozinho. Estados: live (em dia), stale (atrasado),
// err (falhou e sem valor), ref (referência), off (sem leitura ainda).
function stampState(id) {
  const h = HEALTH[id]; if (!h) return { cls: 'off', txt: L('sem fonte', 'no source') };
  const d = SRC[id] || {};
  if (d.kind === 'ref') return { cls: 'ref', txt: L('referência', 'reference') };
  if (!h.ts) return h.ok === false ? { cls: 'err', txt: L('indisponível', 'unavailable') } : { cls: 'off', txt: L('carregando', 'loading') };
  const age = Date.now() - h.ts, every = d.every || 60000;
  const slack = d.kind === 'daily' ? 36 * 3600e3 : every * 2.5 + 20000;
  const cls = age <= slack ? 'live' : 'stale';
  return { cls, txt: d.kind === 'daily' && h.dataTs ? L('dado de ', 'data from ') + fmtDate(h.dataTs, { day: '2-digit', month: 'short' }) : ago(h.ts) };
}
function stamp(id, provider) {
  const p = provider || (SRC[id] && SRC[id].provider) || '';
  const st = stampState(id);
  return `<span class="stamp ${st.cls}" data-src="${esc(id)}" data-prov="${esc(p)}" title="${esc(stampTitle(id))}"><i class="dot"></i><b>${esc(p)}</b><span class="st">${esc(st.txt)}</span></span>`;
}
function stampTitle(id) {
  const h = HEALTH[id]; if (!h) return '';
  const parts = [];
  if (h.ts) parts.push(L('Última leitura: ', 'Last read: ') + fmtDateTime(h.ts));
  if (h.err) parts.push(L('Último erro: ', 'Last error: ') + h.err);
  if (SRC[id] && SRC[id].every) parts.push(L('Atualiza a cada ', 'Refreshes every ') + humanEvery(SRC[id].every));
  return parts.join('\n');
}
function humanEvery(ms) { const s = ms / 1000; return s < 60 ? `${s} s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.round(s / 3600)} h`; }
function stampsRefresh() {
  $$('.stamp[data-src]').forEach((el) => {
    const st = stampState(el.dataset.src);
    el.className = 'stamp ' + st.cls;
    const s = el.querySelector('.st'); if (s && s.textContent !== st.txt) s.textContent = st.txt;
    el.title = stampTitle(el.dataset.src);
  });
}

// ---------- dados do robô (ramo "data" do GitHub, gerado pelo GitHub Actions) ----------
// Nunca é a única fonte: se estiver velho ou faltando, cada página busca direto.
async function getPipeline(name, maxAgeMs = 3 * 3600e3) {
  const bucket = Math.floor(Date.now() / 120000); // 2 min: evita cache velho do CDN
  const j = await getJSON(`${NX.dataBase}${name}.json?v=${bucket}`, { timeout: 10000 });
  const gen = Date.parse(j && j.generatedAt);
  if (!gen || Date.now() - gen > maxAgeMs) throw new Error(L('arquivo do robô desatualizado', 'pipeline file stale'));
  return j;
}

// ---------- RSS (fallback direto do navegador via rss2json) ----------
async function rssItems(feedUrl, max = 12) {
  const j = await getJSON('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feedUrl), { timeout: 14000 });
  if (!j || j.status !== 'ok' || !Array.isArray(j.items)) throw new Error('rss');
  const feedTitle = (j.feed && j.feed.title) || hostOf(feedUrl);
  return j.items.slice(0, max).map((it) => ({
    t: stripHtml(it.title), u: it.link, d: parseDate(it.pubDate).getTime(),
    x: stripHtml(it.description).slice(0, 260),
    img: it.thumbnail || (it.enclosure && /image/.test(it.enclosure.type || '') ? it.enclosure.link : '') || '',
    src: feedTitle,
  })).filter((n) => n.t && n.u && isNum(n.d));
}

// ---------- auto-auditoria: procura número quebrado na tela ----------
function nxAudit() {
  const issues = [];
  const root = $('#main'); if (!root) return issues;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const bad = /\b(NaN|undefined|Infinity|null)\b|\[object Object\]/;
  let n;
  while ((n = walker.nextNode())) {
    const el = n.parentElement;
    if (!el || el.closest('.pg:not(.on)') || el.closest('script,style,.no-audit')) continue;
    if (bad.test(n.nodeValue)) issues.push({ text: n.nodeValue.trim().slice(0, 80), where: el.closest('[id]')?.id || el.tagName });
  }
  const stale = Object.values(HEALTH).filter((h) => SRC[h.id] && SRC[h.id].need() && h.ts && SRC[h.id].kind === 'live' && Date.now() - h.ts > SRC[h.id].every * 4 + 60000);
  stale.forEach((h) => issues.push({ text: L('fonte atrasada: ', 'stale source: ') + h.label, where: h.id }));
  window.__nxAudit = { ts: Date.now(), issues };
  return issues;
}

// ---------- confere quais pares estão negociando (a cada 24 h) ----------
async function validateUniverse() {
  const cached = LS.get('binance:valid');
  if (cached && Date.now() - cached.ts < 24 * 3600e3) return;
  const syms = [...UNIVERSE.map((c) => c.s), ...AUX_PAIRS];
  for (const base of ['https://api.binance.com', 'https://data-api.binance.vision']) {
    try {
      const j = await getJSON(`${base}/api/v3/exchangeInfo?symbols=${encodeURIComponent(JSON.stringify(syms))}`, { timeout: 12000 });
      const ok = (j.symbols || []).filter((s) => s.status === 'TRADING').map((s) => s.symbol);
      if (ok.length > 10) {
        VALID = new Set(ok);
        LS.set('binance:valid', { ts: Date.now(), list: ok });
        return;
      }
    } catch (e) { /* tenta o próximo servidor */ }
  }
}

function _applyTicker(t, src) {
  const p = num(t.lastPrice ?? t.c), o = num(t.openPrice ?? t.o);
  if (p === null || p <= 0) return;
  const closeT = num(t.closeTime ?? t.C);
  // par parado (sem negociação há mais de 15 min) não é "ao vivo": fica fora
  if (closeT && Date.now() - closeT > 15 * 60e3 && src === 'rest') { delete PX[t.symbol ?? t.s]; return; }
  const sym = t.symbol ?? t.s;
  // o REST de segurança não sobrescreve um preço mais novo vindo do WebSocket
  if (src === 'rest' && PX[sym] && PX[sym].src === 'ws' && Date.now() - PX[sym].seen < 15000) return;
  const prev = PX[sym] ? PX[sym].p : null;
  PX[sym] = {
    p, o, prev,
    chg: num(t.priceChangePercent ?? t.P) ?? (o ? ((p - o) / o) * 100 : null),
    hi: num(t.highPrice ?? t.h), lo: num(t.lowPrice ?? t.l), qv: num(t.quoteVolume ?? t.q),
    ts: closeT || Date.now(), seen: Date.now(), src,
  };
  _markDirty(sym);
}

async function priceSnapshot() {
  const syms = streamSyms();
  let lastErr;
  for (const base of ['https://api.binance.com', 'https://data-api.binance.vision']) {
    try {
      const arr = await getJSON(`${base}/api/v3/ticker/24hr?symbols=${encodeURIComponent(JSON.stringify(syms))}`, { timeout: 10000 });
      if (!Array.isArray(arr)) throw new Error('formato');
      arr.forEach((t) => _applyTicker(t, 'rest'));
      return arr.length;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('binance');
}

// ---------- WebSocket ----------
const WS_HOSTS = ['wss://stream.binance.com:9443', 'wss://data-stream.binance.vision'];
function wsStart() {
  try { if (WSS.ws) { WSS.ws.onclose = null; WSS.ws.close(); } } catch { /* */ }
  const url = `${WS_HOSTS[WSS.host % WS_HOSTS.length]}/stream?streams=${streamSyms().map((s) => s.toLowerCase() + '@ticker').join('/')}`;
  let ws;
  try { ws = new WebSocket(url); } catch (e) { return wsRetry(); }
  WSS.ws = ws;
  ws.onopen = () => { WSS.ok = true; WSS.fails = 0; WSS.last = Date.now(); WSS.polling = false; liveStatus(); };
  ws.onmessage = (ev) => {
    WSS.last = Date.now();
    try { const m = JSON.parse(ev.data); if (m && m.data && m.data.s) _applyTicker(m.data, 'ws'); } catch { /* ignora quadro inválido */ }
  };
  ws.onerror = () => { try { ws.close(); } catch { /* */ } };
  ws.onclose = () => { WSS.ok = false; liveStatus(); wsRetry(); };
}
function wsRetry() {
  WSS.fails++; WSS.host++;
  if (WSS.fails >= 3) WSS.polling = true; // sem WebSocket: o REST de segurança passa a cada 10 s
  const wait = Math.min(30000, 1000 * 2 ** Math.min(WSS.fails, 5)) * (0.8 + Math.random() * 0.4);
  clearTimeout(WSS.timer);
  WSS.timer = setTimeout(() => { if (!document.hidden) wsStart(); }, wait);
}
function wsWatchdog() {
  if (document.hidden) return;
  if (WSS.ok && Date.now() - WSS.last > 25000) { try { WSS.ws.close(); } catch { /* */ } }
  liveStatus();
}
function liveStatus() {
  const el = $('#live-pill'); if (!el) return;
  const fresh = WSS.ok && Date.now() - WSS.last < 20000;
  const restFresh = HEALTH['px-rest'] && HEALTH['px-rest'].ts && Date.now() - HEALTH['px-rest'].ts < 90000;
  el.classList.toggle('on', fresh);
  el.classList.toggle('warn', !fresh && !!restFresh);
  const txt = fresh ? L('Ao vivo', 'Live') : restFresh ? L('Atualizando', 'Updating') : L('Conectando', 'Connecting');
  const t = el.querySelector('.txt'); if (t) t.textContent = txt;
  el.title = fresh ? L('Preços em tempo real (Binance WebSocket)', 'Real-time prices (Binance WebSocket)')
    : restFresh ? L('WebSocket indisponível: preços por consulta a cada 10 s', 'WebSocket down: polling every 10 s')
      : L('Conectando à Binance…', 'Connecting to Binance…');
}

function brlRate() {
  if (FX.usdbrl) return { v: FX.usdbrl, src: FX.src };
  const u = PX.USDTBRL; if (u && u.p) return { v: u.p, src: 'USDT/BRL Binance' };
  return null;
}
const toBRL = (usdv) => { const r = brlRate(); return r && isNum(usdv) ? usdv * r.v : null; };

// ---------- preço de qualquer ativo ----------
// chave: par Binance ('BTCUSDT'), símbolo base ('BTC') ou id CoinGecko ('bitcoin')
function priceOf(key) {
  if (!key) return null;
  const c = BY_SYM[key] || BY_BASE[String(key).toUpperCase()] || BY_CG[key];
  if (c && PX[c.s]) return { p: PX[c.s].p, chg: PX[c.s].chg, ts: PX[c.s].seen, src: 'Binance', live: true };
  if (PX[key]) return { p: PX[key].p, chg: PX[key].chg, ts: PX[key].seen, src: 'Binance', live: true };
  const id = c ? c.cg : key;
  if (XP[id]) return { p: XP[id].p, chg: XP[id].chg, ts: XP[id].ts, src: 'CoinGecko', live: false };
  if (CGM[id] && isNum(CGM[id].current_price)) return { p: CGM[id].current_price, chg: CGM[id].price_change_percentage_24h, ts: CGM[id]._ts, src: 'CoinGecko', live: false };
  return null;
}

function parseHash() {

}

}
let _pageParams = {};
function showPage(id, params = {}) {
  if (!PAGES[id] || (PAGES[id].admin && !ACCOUNT.admin)) id = 'dash';
  const p = PAGES[id];
  const prev = S.page && PAGES[S.page];
  _pageParams = params;
  if (prev && prev.id !== id && prev.hide) { try { prev.hide(); } catch (e) { console.warn('[NX] hide', e); } }
  let el = $('#pg-' + id);
  if (!el) {
    el = document.createElement('section');
    el.className = 'pg'; el.id = 'pg-' + id; el.setAttribute('aria-labelledby', 'pt-' + id);
    $('#main').appendChild(el);
  }
  $$('.pg.on').forEach((x) => x !== el && x.classList.remove('on'));
  S.page = id;
  if (!el.dataset.ready) {
    el.dataset.ready = '1';
    try { p.init(el, params); } catch (e) { console.error('[NX] init', id, e); el.innerHTML = errorBlock(e); }
  }
  el.classList.add('on');
  if (p.show) { try { p.show(el, params); } catch (e) { console.warn('[NX] show', id, e); } }
  document.title = `${pageTitle(p)} · NEXUS HUB`;
  markCurrent();
  document.body.classList.remove('sb-open');
  const main = $('#main'); if (main && !params.keep) main.scrollTop = 0;
  if (window.innerWidth <= 900 && !params.keep) window.scrollTo(0, 0);
  // fontes que só rodam com a página aberta passam a valer agora
  setTimeout(refreshStale, 50);
}

function toast(msg, { type = 'info', ms = 4200, action } = {}) {
  const wrap = $('#toasts'); if (!wrap) return;
  const el = document.createElement('div');
  el.className = `toast ${type}`; el.setAttribute('role', type === 'err' ? 'alert' : 'status');
  const icn = { ok: 'circle-check', err: 'triangle-alert', warn: 'triangle-alert', info: 'info' }[type] || 'info';
  el.innerHTML = `${ico(icn, 18)}<span class="msg">${esc(msg)}</span>${action ? `<button class="act">${esc(action.label)}</button>` : ''}<button class="cls" aria-label="${esc(L('Fechar', 'Close'))}">${ico('x', 16)}</button>`;
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 220); };
  el.querySelector('.cls').onclick = kill;
  if (action) el.querySelector('.act').onclick = () => { kill(); action.fn(); };
  wrap.appendChild(el);

  setTimeout(kill, action ? Math.max(ms, 7000) : ms);
}

// ---------- bibliotecas sob demanda ----------
const _libs = {};
function loadScript(lib) {
  if (window[lib.global]) return Promise.resolve(window[lib.global]);
  if (_libs[lib.global]) return _libs[lib.global];
  _libs[lib.global] = (async () => {
    let lastErr;
    for (const url of lib.urls) {
      try {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = url; s.async = true; s.crossOrigin = 'anonymous';
          if (lib.sri) s.integrity = lib.sri;
          const t = setTimeout(() => { s.remove(); rej(new Error('timeout')); }, 20000);
          s.onload = () => { clearTimeout(t); res(); };
          s.onerror = () => { clearTimeout(t); s.remove(); rej(new Error('falha ao carregar ' + hostOf(url))); };
          document.head.appendChild(s);
        });
        if (window[lib.global]) return window[lib.global];
      } catch (e) { lastErr = e; }
    }
    _libs[lib.global] = null;
    throw lastErr || new Error(L('biblioteca indisponível', 'library unavailable'));

}

// ---------- velas (klines) da Binance com cache curto ----------
const KL_TTL = { '1m': 15e3, '5m': 30e3, '15m': 60e3, '1h': 120e3, '4h': 300e3, '1d': 600e3, '1w': 3600e3, '1M': 3600e3 };
const _kl = new Map();
async function klines(sym, interval = '1d', limit = 500, { startTime, endTime } = {}) {
  const key = [sym, interval, limit, startTime || '', endTime || ''].join('|');
  const hit = _kl.get(key);
  if (hit && (hit.pending || Date.now() - hit.ts < (KL_TTL[interval] || 60e3))) return hit.p;
  const p = (async () => {
    let lastErr;
    for (const base of ['https://api.binance.com', 'https://data-api.binance.vision']) {
      try {
        const qs = new URLSearchParams({ symbol: sym, interval, limit: String(limit) });
        if (startTime) qs.set('startTime', String(startTime));
        if (endTime) qs.set('endTime', String(endTime));
        const a = await getJSON(`${base}/api/v3/klines?${qs}`, { timeout: 14000 });
        if (!Array.isArray(a)) throw new Error('klines');
        return a.map((k) => ({ t: k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4], v: +k[5], qv: +k[7], ct: k[6] }))
          .filter((k) => isNum(k.c) && k.c > 0);
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('binance');
  })();
  const rec = { p, ts: Date.now(), pending: true };
  _kl.set(key, rec);
  p.then(() => { rec.pending = false; rec.ts = Date.now(); }, () => _kl.delete(key));
  if (_kl.size > 120) _kl.delete(_kl.keys().next().value);
  return p;
}
// histórico longo (pagina de 1000 em 1000 velas a partir de uma data)
async function klinesSince(sym, interval, fromMs) {
  const out = [];
  let start = fromMs;
  for (let guard = 0; guard < 8; guard++) {
    const page = await klines(sym, interval, 1000, { startTime: start });
    if (!page.length) break;
    out.push(...page);
    if (page.length < 1000) break;
    start = page[page.length - 1].t + 1;
  }
  return out;
}

// ---------- indicadores ----------
function sma(vals, n) {
  const out = new Array(vals.length).fill(null); let s = 0;
  for (let i = 0; i < vals.length; i++) {
    s += vals[i]; if (i >= n) s -= vals[i - n];
    if (i >= n - 1) out[i] = s / n;
  }
  return out;
}
function ema(vals, n) {
  const out = new Array(vals.length).fill(null); const k = 2 / (n + 1); let e = null;
  for (let i = 0; i < vals.length; i++) {
    if (i === n - 1) e = avg(vals.slice(0, n));
    else if (i >= n) e = vals[i] * k + e * (1 - k);
    if (e !== null) out[i] = e;
  }
  return out;
}
function bollinger(vals, n = 20, mult = 2) {
  const mid = sma(vals, n), up = [], lo = [];
  for (let i = 0; i < vals.length; i++) {
    if (mid[i] === null) { up.push(null); lo.push(null); continue; }
    let s = 0; for (let j = i - n + 1; j <= i; j++) s += (vals[j] - mid[i]) ** 2;
    const sd = Math.sqrt(s / n);
    up.push(mid[i] + mult * sd); lo.push(mid[i] - mult * sd);
  }
  return { mid, up, lo };
}
// RSI de Wilder (o mesmo das corretoras)
function rsiSeries(closes, n = 14) {
  const out = new Array(closes.length).fill(null);
  if (closes.length <= n) return out;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const d = closes[i] - closes[i - 1]; if (d > 0) g += d; else l -= d; }
  let ag = g / n, al = l / n;
  out[n] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
  for (let i = n + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    ag = (ag * (n - 1) + Math.max(d, 0)) / n;
    al = (al * (n - 1) + Math.max(-d, 0)) / n;
    out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
  }
  return out;
}
const lastOf = (arr) => { for (let i = arr.length - 1; i >= 0; i--) if (isNum(arr[i])) return arr[i]; return null; };

}

// ---------- SVG ----------
function sparkSVG(vals, { w = 110, h = 28, color } = {}) {
  const v = (vals || []).filter(isNum);
  if (v.length < 2) return '';
  const mn = Math.min(...v), mx = Math.max(...v), r = mx - mn || 1;
  const step = w / (v.length - 1);
  const pts = v.map((x, i) => `${(i * step).toFixed(1)},${(h - 2 - ((x - mn) / r) * (h - 4)).toFixed(1)}`);
  const c = color || (v[v.length - 1] >= v[0] ? 'var(--up)' : 'var(--down)');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" width="100%" height="${h}" aria-hidden="true"><path d="M0,${h} L${pts.join(' L')} L${w},${h} Z" style="fill:${c};opacity:.12"/><polyline points="${pts.join(' ')}" style="fill:none;stroke:${c};stroke-width:1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
// velocímetro 0–100 (Fear & Greed)
function gaugeSVG(value) {
  const R = 80, cx = 100, cy = 100;
  const pt = (v) => { const a = Math.PI * (1 - v / 100); return [cx + R * Math.cos(a), cy - R * Math.sin(a)]; };
  const arc = (a, b, col) => { const [x1, y1] = pt(a), [x2, y2] = pt(b); return `<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 0 1 ${x2.toFixed(2)},${y2.toFixed(2)}" style="fill:none;stroke:${col};stroke-width:15;stroke-linecap:butt"/>`; };
  const bands = [[0, 24.4, fgColor(10)], [25.6, 44.4, fgColor(35)], [45.6, 54.4, fgColor(50)], [55.6, 74.4, fgColor(65)], [75.6, 100, fgColor(90)]];
  let s = `<svg class="fg-svg" viewBox="0 0 200 118" role="img" aria-label="${esc(L('Índice de medo e ganância', 'Fear and greed index'))}: ${isNum(value) ? value : '—'}">`;
  s += bands.map(([a, b, c]) => arc(a, b, c)).join('');
  if (isNum(value)) {
    const [nx, ny] = (() => { const a = Math.PI * (1 - clamp(value, 0, 100) / 100); return [cx + (R - 24) * Math.cos(a), cy - (R - 24) * Math.sin(a)]; })();
    const [mx, my] = pt(clamp(value, 0, 100));
    s += `<circle cx="${mx.toFixed(2)}" cy="${my.toFixed(2)}" r="9" style="fill:var(--panel);stroke:${fgColor(value)};stroke-width:4"/>`;
    s += `<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" style="stroke:var(--text);stroke-width:3.5;stroke-linecap:round"/><circle cx="${cx}" cy="${cy}" r="6.5" style="fill:var(--text)"/>`;
  }
  s += `<text x="16" y="116" style="fill:var(--text-3);font-size:10px">0</text><text x="178" y="116" style="fill:var(--text-3);font-size:10px">100</text></svg>`;
  return s;
}
// rosca (participações)
function donutSVG(parts, { size = 150, thick = 22, label = '' } = {}) {
  const tot = sum(parts.map((p) => Math.max(0, p.v || 0)));
  const R = (size - thick) / 2, C = 2 * Math.PI * R;
  let off = 0, segs = '';
  if (tot > 0) {
    for (const p of parts) {
      const frac = Math.max(0, p.v) / tot; if (frac <= 0) continue;
      const len = frac * C;
      segs += `<circle cx="${size / 2}" cy="${size / 2}" r="${R}" style="fill:none;stroke:${p.c};stroke-width:${thick}" stroke-dasharray="${Math.max(0, len - (parts.length > 1 ? 1.5 : 0)).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${size / 2} ${size / 2})"><title>${esc(p.t || '')}</title></circle>`;
      off += len;
    }
  } else segs = `<circle cx="${size / 2}" cy="${size / 2}" r="${R}" style="fill:none;stroke:var(--panel-3);stroke-width:${thick}"/>`;
  return `<svg class="donut" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)}">${segs}</svg>`;
}

async function authSubmit(m) {
  const f = m.querySelector('#auth-f'), md = f.dataset.mode;
  const msg = m.querySelector('#au-msg'), go = m.querySelector('#au-go');
  const email = m.querySelector('#au-email').value.trim().toLowerCase();
  const password = m.querySelector('#au-pass').value;
  const name = m.querySelector('#au-name').value.trim();
  const say = (k, ok) => { msg.className = 'form-msg ' + (ok ? 'ok' : 'err'); msg.textContent = k; };
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return say(authErr('email'));
  if (md === 'signup') {
    if (!name || name.length > 80) return say(authErr('name'));
    if (password.length < 8 || password.length > 72 || !/[A-Za-z]/.test(password) || !/\d/.test(password)) return say(authErr('password'));
    if (!m.querySelector('#au-terms').checked) return say(authErr('terms'));
  } else if (!password) return say(authErr('invalid'));
  go.classList.add('busy');
  try {
    const sb = await sbClient();
    if (md === 'signup') {
      let r;
      try {
        r = await fetch(`${NX.supabaseUrl}/functions/v1/signup`, {
          method: 'POST', headers: { 'content-type': 'application/json', apikey: NX.supabaseKey },
          body: JSON.stringify({ email, password, name, website: m.querySelector('#au-web').value }),
        });
      } catch { throw new Error('net'); }
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || 'net');
      LS.set('consent', { terms: true, at: new Date().toISOString(), v: 1 });
    }
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw new Error(/invalid/i.test(error.message) ? 'invalid' : error.message);
    closeModal();
    toast(md === 'signup' ? L('Conta criada! Seu teste PRO de 15 dias começou.', 'Account created! Your 15-day PRO trial started.') : L('Você entrou na sua conta.', 'Signed in.'), { type: 'ok' });
  } catch (e) {
    const k = String(e.message || e);
    say(AUTH_ERR[k] ? authErr(k) : /fetch|network|load/i.test(k) ? authErr('net') : k);
  } finally { go.classList.remove('busy'); }
}

function downloadFile(name, text, type = 'application/json') {
  const blob = new Blob([text], { type: type + ';charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
// Lê TODAS as linhas de uma consulta, de 1000 em 1000. O servidor (PostgREST) entrega no máximo
// 1000 linhas por pedido; sem paginar, quem tivesse mais lançamentos veria só parte deles.
// `make(primeira)` monta a consulta (com ordem estável: a última coluna da ordem deve ser única, ex.: id).
async function sbAll(make, size = 1000) {
  const out = []; let total = null;
  for (let from = 0, i = 0; i < 1000; i++) {
    const { data, error, count } = await make(i === 0).range(from, from + size - 1);
    if (error) throw error;
    const rows = data || [];
    if (i === 0 && Number.isFinite(count)) total = count;
    out.push(...rows); from += rows.length;
    if (!rows.length || (total !== null ? out.length >= total : rows.length < size)) break;
  }
  return out;
}

function dbHeartbeat() {
  try {

    LS.set('dbPing', Date.now());
    fetch(NX.supabaseUrl + '/rest/v1/rpc/ping', { method: 'POST', headers: { apikey: NX.supabaseKey, 'content-type': 'application/json' }, body: '{}', credentials: 'omit' }).catch(() => {});
  } catch { /* nunca atrapalha o site */ }
}

function dashCards() {
  if (DASH.cards) return DASH.cards;
  let c = LS.get('dash-cards');
  if (!Array.isArray(c) || !c.length) {
    c = [];
    try { const old = JSON.parse(localStorage.getItem('nx-dash-syms') || 'null'); if (Array.isArray(old)) old.forEach((s) => { if (BY_SYM[s]) c.push({ k: 'b', s }); }); } catch { /* */ }

      if (Array.isArray(ex)) ex.forEach((x) => {
        const id = x && String(x.cgId || x.id || ''); if (!id) return;
        if (BY_CG[id]) c.push({ k: 'b', s: BY_CG[id].s });
        else c.push({ k: 'g', cg: id, b: String(x.sym || '').toUpperCase().slice(0, 12), n: String(x.name || id).slice(0, 40), logo: /^https:/.test(x.logo || '') ? x.logo : '' });
      });
    } catch { /* */ }
    if (!c.length) c = DASH_DEFAULT.map((s) => ({ k: 'b', s }));
  }
  const seen = new Set();
  DASH.cards = c.filter((x) => {
    if (!x) return false;

    if (!key || seen.has(key) || (x.k === 'b' && !BY_SYM[x.s])) return false;
    seen.add(key); return true;

  LS.set('dash-cards', DASH.cards);

function registerMarketSources() {
  source({
    id: 'bcb', label: L('Juros e inflação (BCB)', 'Rates & inflation (BCB)'), provider: 'Banco Central', every: 60 * 60e3,
    need: () => ['markets', 'macro', 'agenda'].includes(S.page),
    run: async () => {
      // "ultimos/N" aceita no máximo 20 valores; a Selic (432) vem preenchida até a próxima reunião, então usa período
      const br = (t) => { const d = new Date(t); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; };
      const sgs = async (n, q) => {
        const a = await getJSON(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${n}/dados${q}${q.includes('?') ? '&' : '?'}formato=json`, { timeout: 12000 });
        return a.map((x) => ({ d: parseDate(x.data).getTime(), v: num(x.valor) })).filter((x) => isNum(x.v)).sort((a, b) => a.d - b.d);
      };
      const [selic, cdi, ipca] = await Promise.all([
        sgs(432, `?dataInicial=${br(Date.now() - 400 * 86400e3)}&dataFinal=${br(Date.now() + 60 * 86400e3)}`),
        sgs(4389, '/ultimos/5'), sgs(13522, '/ultimos/13'),
      ]);
      const today = Date.now();
      const selicNow = [...selic].reverse().find((x) => x.d <= today + 12 * 3600e3) || selic[selic.length - 1];
      const selicPrev = [...selic].reverse().find((x) => x.v !== selicNow.v && x.d < selicNow.d);
      let focus = null;
      try {
        const f = encodeURIComponent("(Indicador eq 'IPCA' or Indicador eq 'Selic') and baseCalculo eq 0");
        const j = await getJSON(`https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/ExpectativasMercadoAnuais?$top=30&$filter=${f}&$orderby=Data%20desc&$format=json&$select=Indicador,Data,DataReferencia,Mediana`, { timeout: 12000 });
        const rows = j.value || []; const last = rows.length ? rows[0].Data : null;
        const y = new Date().getFullYear();
        const pick = (ind, ref) => { const r = rows.find((x) => x.Indicador === ind && x.Data === last && String(x.DataReferencia) === String(ref)); return r ? num(r.Mediana) : null; };
        if (last) focus = { date: last, ipca: pick('IPCA', y), ipcaNext: pick('IPCA', y + 1), selic: pick('Selic', y), selicNext: pick('Selic', y + 1), y };
      } catch { /* Focus é complemento */ }
      return { selic: selicNow, selicPrev, cdi: cdi[cdi.length - 1], ipca: ipca[ipca.length - 1], ipcaPrev: ipca[ipca.length - 2], ipcaSeries: ipca, focus };
    },
    validate: (d) => d.selic && d.selic.v > 1 && d.selic.v < 60,
    onData: () => _markDirty('BCB'),
  });
  source({
    id: 'fed', label: L('Juros dos EUA', 'US rates'), provider: 'NY Fed', every: 60 * 60e3,
    need: () => ['markets', 'macro', 'agenda', 'dash'].includes(S.page),
    run: async () => {
      const j = await getJSON('https://markets.newyorkfed.org/api/rates/unsecured/effr/last/1.json', { timeout: 12000 });
      const r = j.refRates && j.refRates[0];
      return { from: num(r.targetRateFrom), to: num(r.targetRateTo), effr: num(r.percentRate), date: r.effectiveDate };
    },
    validate: (d) => isNum(d.from) && isNum(d.to) && d.to >= d.from && d.to < 25,
    onData: (d) => { HEALTH.fed.dataTs = parseDate(d.date).getTime(); _markDirty('FED'); },
  });
  // outras moedas (opcional): um pedido por par, para que um par indisponível não derrube os outros
  source({
    id: 'fx2', label: L('Outras moedas', 'Other currencies'), provider: 'AwesomeAPI', every: 5 * 60e3,
    need: () => S.page === 'markets',
    run: async () => {
      const pairs = ['JPY-BRL', 'CNY-BRL', 'CHF-BRL', 'CAD-BRL', 'AUD-BRL', 'ARS-BRL', 'HKD-BRL'];
      const res = await Promise.allSettled(pairs.map((p) => getJSON('https://economia.awesomeapi.com.br/json/last/' + p, { timeout: 10000 })));
      const out = {};
      res.forEach((r, i) => { if (r.status !== 'fulfilled') return; const k = pairs[i].replace('-', ''); const x = r.value && r.value[k]; if (x && num(x.bid) > 0) { out[k.toLowerCase()] = num(x.bid); out['c_' + k.toLowerCase()] = num(x.pctChange); } });
      if (!Object.keys(out).length) throw new Error('awesomeapi');
      return out;
    },
    onData: (d) => { FX.more = d; _markDirty('FX'); },
  });
  source({
    id: 'quotes', label: L('Bolsas e índices', 'Indices'), provider: L('robô NEXUS', 'NEXUS bot'), every: 10 * 60e3,
    need: () => ['markets', 'macro'].includes(S.page),
    run: async () => { const j = await getPipeline('markets', 3 * 3600e3); if (!j.quotes || !Object.keys(j.quotes).length) throw new Error(L('sem cotações', 'no quotes')); return { q: j.quotes, gen: Date.parse(j.generatedAt) }; },
    onData: (d) => { HEALTH.quotes.dataTs = d.gen; _markDirty('QUOTES'); },
  });
}

function lastPt(a) { if (!a) return null; for (let i = a.length - 1; i >= 0; i--) if (isNum(a[i])) return { v: a[i], i }; return null; }
function rollMean(a, k) {
  const n = a.length, o = new Array(n).fill(null); let s = 0, c = 0;
  for (let i = 0; i < n; i++) {
    if (isNum(a[i])) { s += a[i]; c++; }
    if (i >= k && isNum(a[i - k])) { s -= a[i - k]; c--; }
    if (i >= k - 1 && c === k) o[i] = s / k;
  }
  return o;
}
const rollSum = (a, k) => rollMean(a, k).map((v) => (isNum(v) ? v * k : null));
function emaS(a, k) {
  const o = new Array(a.length).fill(null); const m = 2 / (k + 1); let e = null, s = 0, c = 0;
  for (let i = 0; i < a.length; i++) {
    const v = a[i]; if (!isNum(v)) continue;
    if (e === null) { s += v; c++; if (c === k) { e = s / k; o[i] = e; } } else { e = v * m + e * (1 - m); o[i] = e; }
  }

}
function ffill(a) { const o = a.slice(); let last = null; for (let i = 0; i < o.length; i++) { if (isNum(o[i])) last = o[i]; else if (last !== null) o[i] = last; } return o; }
const mulA = (a, k) => a.map((v) => (isNum(v) ? v * k : null));
const divA = (a, b) => a.map((v, i) => (isNum(v) && isNum(b[i]) && b[i] !== 0 ? v / b[i] : null));

// ---------- montagem das séries ----------
function hashRibbons(h30, h60, s10, s20) {
  const ev = []; let cap = -1;
  for (let i = 1; i < h30.length; i++) {
    const a = h30[i], b = h60[i], a0 = h30[i - 1], b0 = h60[i - 1];
    if (!isNum(a) || !isNum(b) || !isNum(a0) || !isNum(b0)) continue;
    if (a < b && a0 >= b0) cap = i;
    else if (a > b && a0 <= b0 && cap >= 0) {
      // capitulação de pelo menos 14 dias; compra quando o preço ganha força (média de 10 dias acima da de 20) em até 30 dias
      if (i - cap >= 14) { let buy = -1; for (let k = i; k < Math.min(h30.length, i + 30); k++) if (isNum(s10[k]) && isNum(s20[k]) && s10[k] > s20[k]) { buy = k; break; } ev.push({ cap, rec: i, buy }); }
      cap = -1;
    }
  }
  const lh = lastPt(h30);
  const capNow = lh && isNum(h60[lh.i]) && lh.v < h60[lh.i] ? cap : -1;
  return { ev, capNow, lastI: lh ? lh.i : -1 };
}
function labBuild(j, live) {
  const t0 = Date.parse((j.t0 || '2010-07-18') + 'T00:00:00Z');
  const cm = j.cm || {}, bd = j.bd || {};
  const lp = lastPt(cm.price); if (!lp) return null;
  const today = Math.floor((Date.now() - t0) / DAYMS);
  const hasLive = isNum(live) && live > 0 && today > lp.i;
  const N = hasLive ? today + 1 : lp.i + 1;
  const g = (a) => { const o = new Array(N).fill(null); if (Array.isArray(a)) { const m = Math.min(a.length, N); for (let i = 0; i < m; i++) if (isNum(a[i])) o[i] = a[i]; } return o; };
  const A = {};
  const p = g(cm.price); if (hasLive) p[N - 1] = live;
  A.p = p;
  const pf = ffill(p);
  for (const k of [10, 20, 50, 111, 140, 200, 350, 730, 1400]) A['sma' + k] = rollMean(pf, k);
  A.ema147 = emaS(pf, 147);
  // valor realizado (Coin Metrics): preço ÷ MVRV; hoje = último custo-base publicado
  A.mvrvCM = g(cm.mvrv);
  A.rp = divA(p, A.mvrvCM);
  A.rpF = ffill(A.rp);
  A.mvrv = divA(p, A.rpF);
  A.sup = ffill(g(cm.supply));
  A.mc = g(cm.mcap).map((v, i) => (isNum(v) ? v : isNum(p[i]) && isNum(A.sup[i]) ? p[i] * A.sup[i] : null));
  A.rcF = ffill(divA(A.mc, A.mvrvCM));
  // MVRV Z-Score: (valor de mercado − valor realizado) ÷ desvio-padrão do valor de mercado desde 2010
  A.z = new Array(N).fill(null); A.zSd = new Array(N).fill(null);
  { let n = 0, mean = 0, m2 = 0; for (let i = 0; i < N; i++) { const v = A.mc[i]; if (!isNum(v)) continue; n++; const d = v - mean; mean += d / n; m2 += d * (v - mean); if (n < 30 || !isNum(A.rcF[i])) continue; const sd = Math.sqrt(m2 / n); A.zSd[i] = sd; A.z[i] = (v - A.rcF[i]) / sd; } }
  A.nupl = A.mvrv.map((m) => (isNum(m) && m > 0 ? 1 - 1 / m : null));
  A.mayer = divA(p, A.sma200);
  A.piR = A.sma111.map((v, i) => (isNum(v) && isNum(A.sma350[i]) ? v / (2 * A.sma350[i]) : null));
  A.y2R = divA(p, A.sma730);
  A.w200R = divA(p, A.sma1400);
  A.g350R = divA(p, A.sma350);
  // mineração
  const iss = g(cm.iss), fees = g(cm.fees), hash = g(cm.hash);
  A.puell = divA(iss, rollMean(iss, 365));
  const eh = (a) => a.map((v) => (isNum(v) ? v / 1e6 : null)); // TH/s → EH/s
  A.hash7 = eh(rollMean(hash, 7)); A.h30 = eh(rollMean(hash, 30)); A.h60 = eh(rollMean(hash, 60));
  A.fees7 = rollMean(fees, 7);
  A.rev7 = rollMean(iss.map((v, i) => (isNum(v) && isNum(fees[i]) && isNum(p[i]) ? v + fees[i] * p[i] : null)), 7);
  // rede e corretoras
  A.addr7 = rollMean(g(cm.addr), 7); A.tx7 = rollMean(g(cm.tx), 7); A.bal = g(cm.bal);
  A.exch = g(cm.exch);
  const inf = g(cm.inflow), out = g(cm.outflow);
  A.net7 = rollSum(inf.map((v, i) => (isNum(v) && isNum(out[i]) ? v - out[i] : null)), 7);
  A.fng = g(j.fng);
  // BGeometrics (bitcoin-data.com)
  for (const k of ['sthRealizedPrice', 'lthRealizedPrice', 'trueMarketMean', 'terminalPrice', 'cvdd', 'balancedPrice', 'sthMvrv', 'lthMvrv', 'sopr', 'sthSopr', 'lthSopr', 'aviv', 'reserveRisk', 'rhodlRatio']) A[k] = g(bd[k]);
  A.sopr7 = rollMean(A.sopr, 7); A.sthSopr7 = rollMean(A.sthSopr, 7); A.lthSopr7 = rollMean(A.lthSopr, 7);

function labSigState(s) {
  if (s.special === 'hash') {
    if (!isNum(s.v)) return 'na';
    if (s.lastBuy && isNum(s.hrDays) && s.hrDays <= 30) return 'on';
    if (s.hr.capNow >= 0) return 'near';
    return 'off';
  }
  if (!isNum(s.v)) return 'na';
  const [a, b] = s.thr; const lo = s.dir < 0;
  if (lo ? s.v <= b : s.v >= b) return 'ext';
  if (lo ? s.v <= a : s.v >= a) return 'on';
  const near = s.nearAbs ? (lo ? s.v <= a + s.nearAbs : s.v >= a - s.nearAbs) : (lo ? s.v <= a * 1.1 : s.v >= a * 0.9);
  return near ? 'near' : 'off';
}
// posição no ciclo (modelo): média dos percentis históricos (desde 2012) de MVRV, Mayer e Pi Cycle
function labScore(D) {
  if (D._score !== undefined) return D._score;
  const A = D.A, from = Math.round((Date.UTC(2012, 0, 1) - D.t0) / DAYMS);
  const pct = (a) => { const cur = lastPt(a); if (!cur) return null; let n = 0, le = 0; for (let i = Math.max(0, from); i < a.length; i++) { const v = a[i]; if (!isNum(v)) continue; n++; if (v <= cur.v) le++; } return n ? (le / n) * 100 : null; };
  const parts = [pct(A.mvrv), pct(A.mayer), pct(A.piR)].filter(isNum);
  D._score = parts.length ? avg(parts) : null;
  return D._score;
}

async function bbChart(t, D) {
  const el = $('#bb-mchart'); if (!el) return;
  let r; try { r = await makeChart(el, { priceFmt: (v) => fmtCompact(v, '') }); } catch { el.innerHTML = emptyBox('wifi-off', L('Gráfico indisponível', 'Chart unavailable')); return; }
  const { ch, c } = r;
  ch.applyOptions({ rightPriceScale: { scaleMargins: { top: 0.12, bottom: 0.02 } }, timeScale: { rightOffset: 2 } });
  const tot = new Array(D.N).fill(null);
  for (const s of t.src) for (let i = 0; i < D.N; i++) { const v = s.arr[i]; if (isNum(v)) tot[i] = (tot[i] || 0) + v; }
  const col = (BB_MECH()[t.src.slice().sort((a, b) => (b.d30 || 0) - (a.d30 || 0))[0].type] || BB_MECH().share).c;
  const hs = ch.addHistogramSeries({ color: labRGBA(col, 0.8), priceLineVisible: false, lastValueVisible: false, base: 0 });
  const tm = (i) => ctime(D.t0 + i * 86400e3, false);
  hs.setData(tot.map((v, i) => (isNum(v) ? { time: tm(i), value: v } : null)).filter(Boolean));
  const ma = rollMean(tot.map((v) => (isNum(v) ? v : null)), 7);
  const ls = ch.addLineSeries({ color: c.text, lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
  ls.setData(ma.map((v, i) => (isNum(v) ? { time: tm(i), value: v } : null)).filter(Boolean));
  ch.timeScale().fitContent();
}

function fedDecisions() {
  const h = CACHE.get('fedhist'); if (!h) return null;
  const a = h.v; const at = (d) => { let r = null; for (const x of a) { if (x.d <= d) r = x; else break; } return r; };
  return FOMC.map((iso) => {
    const d = iso.slice(0, 10), t = Date.parse(iso);
    if (t > Date.now()) return { d, t, future: true };
    const next = new Date(t + 86400e3 * 3).toISOString().slice(0, 10);
    const before = at(d), after = at(next);
    if (!before || !after || after.d <= d) return { d, t, unknown: true };
    return { d, t, from: before, to: after, bp: Math.round((after.hi - before.hi) * 100) };
  });
}
function copomDecisions() {
  const h = CACHE.get('selichist'); if (!h) return null;
  const a = h.v; const at = (ms) => { let r = null; for (const x of a) { if (x.t <= ms) r = x; else break; } return r; };
  return COPOM.map((iso) => {
    const t = Date.parse(iso), day = Date.parse(iso.slice(0, 10) + 'T12:00:00Z');
    if (t > Date.now()) return { d: iso.slice(0, 10), t, future: true };
    const before = at(day), after = at(day + 86400e3);
    if (!before || !after || after.t <= day) return { d: iso.slice(0, 10), t, unknown: true };
    return { d: iso.slice(0, 10), t, from: before.v, to: after.v, bp: Math.round((after.v - before.v) * 100) };
  });
}

// =====================================================================
const PM = { tab: 'hot', q: '', tr: {} };
const PM_TABS = () => [['hot', L('Em alta', 'Trending'), 'flame'], ['crypto', 'Cripto', 'bitcoin'], ['economy', L('Economia', 'Economy'), 'landmark'], ['brazil', L('Brasil', 'Brazil'), 'house'], ['politics', L('Política', 'Politics'), 'building-2'], ['geopolitics', L('Geopolítica', 'Geopolitics'), 'earth'], ['ai', L('IA e tecnologia', 'AI & tech'), 'sparkles'], ['sports', L('Esportes', 'Sports'), 'trophy']];
function pmSource(tab) {
  const id = 'pm-' + tab;
  if (SRC[id]) return id;
  source({
    id, label: 'Polymarket · ' + tab, provider: 'Polymarket', every: 5 * 60e3, persist: false,
    need: () => S.page === 'poly' && PM.tab === tab,
    run: async () => getJSON(`https://gamma-api.polymarket.com/events?${tab === 'hot' ? '' : `tag_slug=${tab}&`}active=true&closed=false&order=volume24hr&ascending=false&limit=30`, { timeout: 14000 }),
    validate: (a) => Array.isArray(a),
    onData: () => _markDirty('PM'),
  });
  return id;
}
function pmOutcomes(ev) {
  const mk = (ev.markets || []).filter((m) => m.active && !m.closed);
  const price = (m) => { try { return JSON.parse(m.outcomePrices).map(num); } catch { return []; } };
  const names = (m) => { try { return JSON.parse(m.outcomes); } catch { return ['Sim', 'Não']; } };
  if (mk.length === 1) {
    const p = price(mk[0]), n = names(mk[0]);
    return n.map((x, i) => ({ n: /^yes$/i.test(x) ? L('Sim', 'Yes') : /^no$/i.test(x) ? L('Não', 'No') : x, p: p[i] })).filter((o) => isNum(o.p));
  }
  return mk.map((m) => ({ n: m.groupItemTitle || m.question, p: price(m)[0] })).filter((o) => isNum(o.p)).sort((a, b) => b.p - a.p).slice(0, 3);
}
function pmHtml() {
  return `${pageHead(PAGES.poly, `<button class="btn sm" data-act="pmTr">${ico('languages', 16)}${esc(L('Traduzir títulos', 'Translate titles'))}</button>`)}
  <div class="row wrap between" style="gap:10px;margin-bottom:14px"><div class="seg-scroll">${seg('pm', PM_TABS().map(([v, l, i]) => [v, l, i]), PM.tab)}</div>
  <div class="inp-search" style="min-width:min(300px,100%)">${ico('search', 18)}<input class="inp" type="search" placeholder="${esc(L('Filtrar mercados', 'Filter markets'))}" data-inp="pmQ" autocomplete="off" aria-label="${esc(L('Filtrar', 'Filter'))}"></div></div>
  <div id="pm-list"></div>`;
}
function drawPm() {
  const box = $('#pm-list'); if (!box) return;
  const id = pmSource(PM.tab); const c = CACHE.get(id);
  const top = `<div class="row wrap" style="gap:8px;margin-bottom:12px">${stamp(id)}<span class="tiny faint">${esc(L('Probabilidade = preço da aposta "Sim" (de 0 a 100%). Não é recomendação.', 'Probability = price of the "Yes" share (0–100%). Not advice.'))}</span></div>`;
  if (!c) { box.innerHTML = top + (HEALTH[id] && HEALTH[id].ok === false ? `<div class="panel">${emptyBox('wifi-off', L('Polymarket indisponível agora', 'Polymarket unavailable now'), esc(L('A API pública do Polymarket não respondeu. Tentando de novo automaticamente — nenhum número é mostrado sem vir da fonte.', 'Polymarket’s public API did not respond. Retrying automatically — no number is shown unless it comes from the source.')))}</div>` : `<div class="grid g-auto">${Array.from({ length: 6 }, () => `<div class="pm">${skel(4, 16)}</div>`).join('')}</div>`); return; }
  const q = PM.q.trim().toLowerCase();
  const evs = c.v.filter((e) => !q || (e.title + ' ' + (PM.tr[e.id] || '')).toLowerCase().includes(q));
  if (!evs.length) { box.innerHTML = top + `<div class="panel">${emptyBox('search', L('Nenhum mercado encontrado', 'No market found'))}</div>`; return; }
  box.innerHTML = top + `<div class="grid g-auto">${evs.map((e) => {
    const outs = pmOutcomes(e);
    const end = Date.parse(e.endDate);
    return `<a class="pm" href="https://polymarket.com/event/${esc(encodeURIComponent(e.slug))}" target="_blank" rel="noopener noreferrer">
      <div class="pm-h">${e.image ? `<img class="pm-img" src="${esc(safeUrl(e.image))}" alt="" loading="lazy" width="40" height="40">` : ''}<div class="pm-q">${esc(PM.tr[e.id] || e.title)}</div></div>
      <div class="stack" style="gap:8px">${outs.map((o, i) => `<div class="pm-o"><span class="nm">${esc(o.n)}</span><span class="pv" style="color:${i === 0 ? 'var(--accent)' : 'var(--text-2)'}">${esc(fmtPct(o.p * 100, o.p < 0.01 && o.p > 0 ? 1 : 0, false))}</span><div class="bar"><i style="width:${clamp(o.p * 100, 0.5, 100)}%;background:${i === 0 ? 'var(--accent)' : 'var(--text-3)'}"></i></div></div>`).join('') || `<span class="small faint">${esc(L('sem preço no momento', 'no price right now'))}</span>`}</div>
      <div class="pm-f"><span>${esc(L('Volume 24h', '24h volume'))} <b style="color:var(--text-2)">${esc(fmtCompact(e.volume24hr))}</b></span>${isNum(end) ? `<span>${end > Date.now() ? esc(L('encerra', 'ends')) + ' ' + esc(fmtDate(end, { day: '2-digit', month: 'short', year: 'numeric' })) : esc(L('aguardando resultado', 'awaiting result'))}</span>` : ''}</div></a>`;
  }).join('')}</div>`;
}
ACT.seg_pm = (v) => { PM.tab = v; drawPm(); runSource(pmSource(v)); };
ACT.pmQ = debounce((el) => { PM.q = el.value; drawPm(); }, 160);
ACT.pmTr = async (el) => {
  if (!aiKey()) { toast(L('A tradução usa IA com a sua chave da Anthropic. Cole a chave em Configurações.', 'Translation uses AI with your Anthropic key. Paste it in Settings.'), { type: 'warn', action: { label: L('Abrir', 'Open'), fn: () => go('settings') } }); return; }
  const c = CACHE.get(pmSource(PM.tab)); if (!c) return;
  const todo = c.v.filter((e) => !PM.tr[e.id]).slice(0, 30);
  if (!todo.length) return;
  el.classList.add('busy');
  try {
    const out = await aiCall([{ role: 'user', content: `Traduza para ${S.lang === 'en' ? 'English' : 'português do Brasil'} estes títulos de mercados de previsão. Responda SÓ com um JSON no formato {"id":"tradução"}, sem comentários.\n${JSON.stringify(Object.fromEntries(todo.map((e) => [e.id, e.title])))}` }], { model: NX.aiModelFast, max: 2500 });
    const j = JSON.parse(out.slice(out.indexOf('{'), out.lastIndexOf('}') + 1));
    Object.entries(j).forEach(([k, v]) => { if (typeof v === 'string' && v.length < 300) PM.tr[k] = v; });
    drawPm();
  } catch (e) { toast(L('Não foi possível traduzir agora: ', 'Could not translate now: ') + e.message, { type: 'err' }); }
  el.classList.remove('busy');
};
onPrice((set) => { if (S.page === 'poly' && set.has('PM')) drawPm(); });
page({
  id: 'poly', group: 'macro', icon: 'target', pt: 'Polymarket', en: 'Polymarket',
  sub: 'O que as pessoas estão apostando, com dinheiro real, sobre economia, cripto, eleições e o mundo.',
  subEn: 'What people are betting, with real money, on economics, crypto, elections and the world.',
  init(el) { el.innerHTML = pmHtml(); drawPm(); runSource(pmSource(PM.tab)); },
  show() { drawPm(); },
});

// =====================================================================
const NEWS_CATS = {
  cripto: { pt: 'Cripto', en: 'Crypto', icon: 'bitcoin', maxH: 72, feeds: [
    ['https://livecoins.com.br/feed/', 'Livecoins', 'pt'], ['https://portaldobitcoin.uol.com.br/feed/', 'Portal do Bitcoin', 'pt'], ['https://www.criptofacil.com/feed/', 'CriptoFácil', 'pt'],

  mundo: { pt: 'Mundo', en: 'World', icon: 'earth', maxH: 48, feeds: [
    ['https://feeds.bbci.co.uk/portuguese/rss.xml', 'BBC News Brasil', 'pt'], ['https://g1.globo.com/rss/g1/mundo/', 'g1 Mundo', 'pt'], ['https://www.cnnbrasil.com.br/feed/', 'CNN Brasil', 'pt'], ['https://feeds.bbci.co.uk/news/world/rss.xml', 'BBC World', 'en']] },
};
const NEWS = { tab: 'all', en: LS.get('news-en', false), tr: {}, sum: null };
let _pipeNews = null;
function pipelineNews() { // um pedido compartilhado por todas as categorias (vale 60 s)
  if (_pipeNews && Date.now() - _pipeNews.at < 60000) return _pipeNews.p;
  const p = getPipeline('news', 2 * 3600e3);
  _pipeNews = { at: Date.now(), p }; p.catch(() => { _pipeNews = null; });
  return p;
}
// resumo útil ou nada: tira entidades (&nbsp;), o "título + nome do veículo" que o Google Notícias repete
// e os rodapés automáticos ("Fonte: …", "O post … apareceu primeiro em …", "Veja mais notícias…")
const _normT = (s) => cleanTxt(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function newsDesc(x, t, src) {
  let d = cleanTxt(x);
  if (!d) return '';
  d = d.replace(/\s*O post .{0,300}? apareceu primeiro em .*$/i, '').replace(/\s*Fonte:\s.*$/i, '').replace(/\s*Veja mais not[íi]cias.*$/i, '').replace(/\s*The post .{0,300}? appeared first on .*$/i, '').replace(/\s*(Leia mais|Continue lendo|Read more)\b.*$/i, '').trim();
  const nd = _normT(d), nt = _normT(t), ns = _normT(src || '');
  if (!nd || nd.length < 25) return '';
  if (nt && (nd === nt || nd.startsWith(nt) || nt.startsWith(nd))) { const rest = nd.slice(nt.length).trim(); if (!rest || rest === ns || rest.length < 25) return ''; }
  return d;
}
function newsClean(items, maxH) {
  const seen = new Set(), now = Date.now(), byT = new Map();
  const out = [];
  for (const raw of items) {
    if (!raw || !raw.t || !raw.u || !isNum(raw.d)) continue;
    if (raw.d > now + 3600e3 || now - raw.d > maxH * 3600e3) continue; // nem do futuro nem velha demais
    const t = cleanTxt(raw.t), src = cleanTxt(raw.src || '');
    if (!t) continue;
    const n = { ...raw, t, src, x: newsDesc(raw.x, t, src) };
    const k = n.u.split('?')[0] + '|' + t.toLowerCase().slice(0, 60);
    if (seen.has(k)) continue; seen.add(k);
    // a mesma manchete do mesmo veículo (RSS próprio + Google Notícias) aparece uma vez só, com o resumo quando houver
    const kt = _normT(src) + '|' + _normT(t).slice(0, 80);
    const prev = byT.get(kt);
    if (prev) { if (!prev.x && n.x) prev.x = n.x; continue; }
    byT.set(kt, n); out.push(n);
  }
  return out.sort((a, b) => b.d - a.d).slice(0, 80);
}
function registerNewsSources() {
  for (const [cat, def] of Object.entries(NEWS_CATS)) {
    source({
      id: 'news-' + cat, label: L(`Notícias: ${def.pt}`, `News: ${def.en}`), provider: L('fontes de notícia', 'news sources'), every: 5 * 60e3,
      need: () => (S.page === 'news' && (NEWS.tab === cat || NEWS.tab === 'all')) || (S.page === 'tokenomics' && cat === 'cripto'),
      run: async () => {
        try {
          const j = await pipelineNews();
          const arr = j.cats && j.cats[cat];
          if (Array.isArray(arr) && arr.length >= 5) return { items: newsClean(arr, def.maxH), via: 'pipe', gen: Date.parse(j.generatedAt) };
        } catch { /* robô fora: lê direto */ }
        const res = await Promise.allSettled(def.feeds.map(([u, name, lang]) => rssItems(u, 15).then((a) => a.map((n) => ({ ...n, src: name, lang })))));
        const items = res.filter((r) => r.status === 'fulfilled').flatMap((r) => r.value);
        if (!items.length) throw new Error(L('nenhuma fonte respondeu', 'no source responded'));
        return { items: newsClean(items, def.maxH), via: 'rss', ok: res.filter((r) => r.status === 'fulfilled').length, total: def.feeds.length };
      },
      validate: (d) => d.items.length > 0,
      onData: (d) => { SRC['news-' + cat].provider = d.via === 'pipe' ? L('robô NEXUS', 'NEXUS bot') : 'RSS'; _markDirty('NEWS'); },
    });
  }
}
function newsItems(cat) { const c = CACHE.get('news-' + cat); return c ? c.v.items : []; }
function ensureNews(cat) { const h = HEALTH['news-' + cat]; if (!h || !h.ts || Date.now() - h.ts > 5 * 60e3) runSource('news-' + cat, { force: true }); }
function newsFor(name, sym) {
  const items = newsItems('cripto'); if (!items.length) return [];
  const nm = String(name).toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const sy = String(sym).toUpperCase().replace(/[^A-Z0-9]/g, '');
  const re = new RegExp(`\\b${nm}\\b`, 'i'), reS = sy.length >= 3 ? new RegExp(`\\b${sy}\\b`) : null;
  return items.filter((n) => re.test(n.t) || (reS && reS.test(n.t)));
}
function newsHtml() {
  const tabs = [['all', L('Destaques', 'Top'), 'newspaper'], ...Object.entries(NEWS_CATS).map(([k, d]) => [k, L(d.pt, d.en), d.icon])];
  return `${pageHead(PAGES.news, `<button class="btn sm" data-act="newsSum">${ico('sparkles', 16)}${esc(L('Resumo com IA', 'AI summary'))}</button>`)}
  <div class="row wrap between" style="gap:10px;margin-bottom:12px"><div class="seg-scroll">${seg('news', tabs, NEWS.tab)}</div>
  <div class="row wrap" style="gap:12px"><label class="check small" style="align-items:center"><input type="checkbox" data-chg="newsEn" ${NEWS.en ? 'checked' : ''}>${esc(L('Incluir notícias em inglês', 'Include English news'))}</label><button class="btn sm ghost" data-act="newsTr" id="news-tr">${ico('languages', 15)}${esc(L('Traduzir as em inglês', 'Translate English ones'))}</button></div></div>
  <div id="news-sum"></div><div id="news-src" class="row wrap" style="gap:6px;margin-bottom:12px"></div><div id="news-list"></div>`;
}
function newsVisible() {
  const cats = NEWS.tab === 'all' ? Object.keys(NEWS_CATS) : [NEWS.tab];
  let items = [];
  if (NEWS.tab === 'all') {
    // destaques: as mais recentes de cada tema, intercaladas
    const lists = cats.map((c) => newsItems(c).filter((n) => NEWS.en || n.lang !== 'en').slice(0, 9).map((n) => ({ ...n, cat: c })));
    for (let i = 0; i < 9; i++) lists.forEach((l) => { if (l[i]) items.push(l[i]); });
  } else items = newsItems(NEWS.tab).filter((n) => NEWS.en || n.lang !== 'en').map((n) => ({ ...n, cat: NEWS.tab }));
  return { cats, items };
}
function newsCard(n, lead) {
  const t = NEWS.tr[n.u] || n.t;
  return `<a class="nc ${lead ? 'lead' : ''}" href="${esc(safeUrl(n.u))}" target="_blank" rel="noopener noreferrer">
    ${n.img && lead ? `<img class="nc-img" src="${esc(safeUrl(n.img))}" alt="" loading="lazy">` : ''}
    <div class="nc-top"><span class="nc-src">${esc(n.src)}</span>${n.lang === 'en' ? `<span class="badge">${NEWS.tr[n.u] ? esc(L('traduzida', 'translated')) : 'EN'}</span>` : ''}<span>·</span><span title="${esc(fmtDateTime(n.d))}">${esc(ago(n.d))}</span></div>
    <div class="nc-t">${esc(t)}</div>${n.x && !NEWS.tr[n.u] ? `<div class="nc-x">${esc(n.x)}</div>` : ''}
    <div class="nc-foot"><span>${esc(L(NEWS_CATS[n.cat] ? NEWS_CATS[n.cat].pt : '', NEWS_CATS[n.cat] ? NEWS_CATS[n.cat].en : ''))}</span><span class="row" style="gap:4px">${esc(L('ler na fonte', 'read at source'))}${ico('external-link', 14)}</span></div></a>`;
}
function drawNews() {

  const { cats, items } = newsVisible();

ACT.seg_news = (v) => { NEWS.tab = v; drawNews(); (v === 'all' ? Object.keys(NEWS_CATS) : [v]).forEach(ensureNews); };
ACT.newsEn = (el) => { NEWS.en = el.checked; LS.set('news-en', NEWS.en); drawNews(); };
async function translateItems(items) {

onPrice((set) => { if (set.has('NEWS')) { if (S.page === 'news') drawNews(); if (S.page === 'geo') drawGeo(); } });
page({

// ---------- GEOPOLÍTICA E CONFLITOS ----------
// Base: Projeto X (Radar Agora). Geopolítica = guerras, conflitos, Oriente Médio, Rússia–Ucrânia, China,
// EUA e rotas de energia; Internacional = política e sociedade sem conflito armado. Cada notícia mostra a

function wwCompact(a) { const o = { k: a.k, q: a.q, net: a.net, s: a.s, n: a.n }; for (const f of ['cg', 'x', 'px', 'logo', 'ca', 'st']) if (a[f]) o[f] = a[f]; return o; }
async function wwReadOne(w, { full = false, quiet = false } = {}) {
  if (WW.busy.has(w.id)) return;
  WW.busy.add(w.id); wwDrawWallets();
  const prev = WW.r[w.id];
  try {
    const fn = WW_READERS[w.kind]; if (!fn) throw new Error(L('rede não suportada', 'unsupported network'));
    const isFull = full || !prev || !prev.x || !prev.x.full || Date.now() - (prev.x.full || 0) > 6 * 3600e3;
    const res = await fn(w, prev, isFull);
    // rede EVM que falhou nesta leitura: fica o último saldo lido dela (marcado com o horário)
    if (w.kind === 'evm' && res.part && prev && prev.a) {
      const failed = WW_EVM.filter((c) => res.part.includes(c.n + ':')).map((c) => c.k).concat(res.part.includes('Hyperliquid:') ? ['hl'] : []);
      for (const a of prev.a) if (failed.includes(a.net)) res.a.push({ ...a, st: a.st || prev.t });
    }
    const rd = { t: Date.now(), ok: true, src: res.src, a: res.a.map(wwCompact), hid: res.hid || 0, part: res.part || '', x: res.x || {}, txs: res.txs || [], err: '' };
    if (!WW.d.w.some((x) => x.id === w.id)) { WW.busy.delete(w.id); return; } // removida durante a leitura
    wwDetectChanges(w, prev, rd);
    WW.r[w.id] = rd;
  } catch (e) {
    const msg = String((e && e.message) || e).slice(0, 140);
    if (WW.d.w.some((x) => x.id === w.id)) WW.r[w.id] = prev && prev.t ? { ...prev, err: msg, errT: Date.now() } : { t: 0, ok: false, a: [], err: msg, errT: Date.now(), x: {} };
  }
  WW.busy.delete(w.id);
  wwSaveRead();
  if (!quiet) await wwPricesFor([w]);
  wwRedraw(!quiet);
}
async function wwRefreshAll({ full = false } = {}) {
  const ws = WW.d.w.slice();
  if (!ws.length) return { n: 0 };
  await wwPool(ws, 3, (w) => wwReadOne(w, { full, quiet: true }));
  await wwPricesFor(ws);
  WW.lastAll = Date.now();
  wwSnapshot(); wwRedraw(true);
  const bad = ws.filter((w) => WW.r[w.id] && WW.r[w.id].err).length;
  if (bad === ws.length) throw new Error(L('nenhuma carteira pôde ser lida agora', 'no wallet could be read now'));
  return { n: ws.length, bad };
}
const _wwPxAt = {};
async function wwPricesFor(ws, force) {
  const ids = new Set();
  for (const w of ws) for (const a of (WW.r[w.id] && WW.r[w.id].a) || []) if (a.cg) ids.add(a.cg);
  const due = [...ids].filter((id) => force || !(_wwPxAt[id] && Date.now() - _wwPxAt[id] < 150e3));
  if (!due.length) return;
  due.forEach((id) => { _wwPxAt[id] = Date.now(); });
  await wwFetchPrices(due).catch(() => 0);
}
// mudanças de saldo entre duas leituras completas (vale para todas as redes)
function wwDetectChanges(w, prev, cur) {
  if (!prev || !prev.ok || !prev.t || prev.err || prev.part || cur.part) return;
  const sumBy = (rd) => { const m = {}; for (const a of rd.a) { if (a.x === 'perp' || a.st) continue; const k = `${a.k}|${a.net}|${a.x || ''}`; m[k] = m[k] || { q: 0, a }; m[k].q += a.q; } return m; };
  const p = sumBy(prev), c = sumBy(cur);
  for (const k of new Set([...Object.keys(p), ...Object.keys(c)])) {
    const q0 = p[k] ? p[k].q : 0, q1 = c[k] ? c[k].q : 0, d = q1 - q0;
    if (Math.abs(d) <= Math.max(Math.abs(q0), Math.abs(q1)) * 1e-6 || Math.abs(d) < 1e-9) continue;
    const a = (c[k] || p[k]).a;
    WW.ev.unshift({ t: cur.t, p0: prev.t, w: w.id, k: a.k, s: a.s, n: a.n, net: a.net, cg: a.cg || null, d, x: a.x || '' });
  }
  WW.ev = WW.ev.slice(0, 80); LS.set('ww-ev', WW.ev);
}
// registro diário do total (por portfólio e geral), só quando todas as carteiras estão em dia
function wwSnapshot() {
  const day = todayISO(); const r = brlRate(); let changed = false;
  for (const pf of ['all', ...WW.d.pf.map((p) => p.id)]) {
    const ws = wwWallets(pf); if (!ws.length) continue;
    if (ws.some((w) => { const x = WW.r[w.id]; return !x || !x.ok || x.err || Date.now() - x.t > 30 * 60e3; })) continue;
    const T = wwTotals(ws); if (!isNum(T.usd)) continue;
    const arr = WW.hist[pf] || (WW.hist[pf] = []);
    const row = [day, Math.round(T.usd * 100) / 100, r ? Math.round(T.usd * r.v * 100) / 100 : null];
    if (arr.length && arr[arr.length - 1][0] === day) arr[arr.length - 1] = row; else arr.push(row);
    if (arr.length > 400) arr.splice(0, arr.length - 400);
    changed = true;
  }
  if (changed) LS.set('ww-hist', WW.hist);
}

ACT.wwImport = () => {
  closeMenus();
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    if (f.size > 500000) { toast(L('Arquivo grande demais.', 'File too large.'), { type: 'err' }); return; }
    try {
      const j = JSON.parse(await f.text());
      const pfs = Array.isArray(j.portfolios) ? j.portfolios : []; const list = Array.isArray(j.carteiras) ? j.carteiras : Array.isArray(j.wallets) ? j.wallets : [];
      // segurança: se houver qualquer segredo no arquivo, nada é importado
      if (list.some((x) => wwDetect(String((x && (x.endereco || x.address)) || '')).secret)) { toast(L('O arquivo tem chave privada ou frase-semente. Por segurança, nada foi importado.', 'The file contains a private key or seed. Nothing was imported.'), { type: 'err', ms: 9000 }); return; }
      const map = {}; let added = 0, skipped = 0;
      for (const p of pfs) { const ex = WW.d.pf.find((x) => x.n === String(p.nome || p.name || '').slice(0, 30)); if (ex) map[p.id] = ex.id; else { const np = await wwNewPf(p.nome || p.name); if (np) map[p.id] = np.id; } }
      for (const x of list) {
        const d = wwDetect(String(x.endereco || x.address || ''));
        if (!d.ok || d.kind === 'ens' || WW.d.w.length >= WW_MAX || WW.d.w.some((w) => w.addr.toLowerCase() === d.addr.toLowerCase())) { skipped++; continue; }
        WW.d.w.push({ id: 'w' + uid().slice(0, 9), kind: d.kind, addr: d.addr, label: String(x.nome || x.label || d.addr.slice(0, 10)).slice(0, 40), pf: map[x.portfolio] || WW.d.pf[0].id, at: Date.now(), ...(x.ens ? { ens: String(x.ens).slice(0, 80) } : {}) });
        added++;
      }
      wwSave(); wwDraw();
      toast(L(`${added} carteira(s) importada(s)${skipped ? `, ${skipped} ignorada(s) (repetidas ou inválidas)` : ''}.`, `${added} imported${skipped ? `, ${skipped} skipped` : ''}.`), { type: added ? 'ok' : 'warn', ms: 6000 });
      if (added) { if (!WWT.list) await runSource('ww-tok', { force: true }); wwRefreshAll({ full: true }).catch(() => {}); }
    } catch (e) { toast(L('Não foi possível ler o arquivo: ', 'Could not read the file: ') + (e.message || e), { type: 'err' }); }
  };
  inp.click();
};

// ---------- comparação: os mesmos aportes e vendas, nas mesmas datas, em outros investimentos ----------
// Simulação com dados reais (não é previsão): cada compra vira um aporte em reais no mesmo dia; cada venda,
// um resgate do mesmo valor. Cores fixas por investimento (validadas para daltonismo, nos 4 temas).
const VCMP_DEF = [
  { k: 'usd', n: () => L('Dólar', 'US dollar'), v: '--cmp-1', src: () => L('dólar PTAX (Banco Central)', 'PTAX dollar (Central Bank of Brazil)') },
  { k: 'btc', n: () => 'Bitcoin', v: '--cmp-2', src: () => L('Binance × PTAX', 'Binance × PTAX') },
  { k: 'cdi', n: () => 'CDI', v: '--cmp-3', src: () => L('Banco Central, série 12 (100% do CDI)', 'Central Bank of Brazil, series 12 (100% of CDI)') },
  { k: 'ibov', n: () => 'Ibovespa', v: '--cmp-4', src: () => L('Yahoo Finance, pelo robô do NEXUS (índice de retorno total: já inclui os dividendos)', 'Yahoo Finance via the NEXUS bot (total return index: dividends included)') },
  { k: 'spx', n: () => 'S&P 500', v: '--cmp-5', src: () => L('Yahoo Finance × PTAX (só o preço do índice, sem os dividendos)', 'Yahoo Finance × PTAX (price index, no dividends)') },
];
// taxa interna de retorno anual (TIR): fluxos {t, v}, aportes negativos e resgates/valor final positivos
function xirr(flows) {
  if (flows.length < 2 || !flows.some((f) => f.v < 0) || !flows.some((f) => f.v > 0)) return null;
  const t0 = flows[0].t; const yr = (t) => (t - t0) / (365.25 * 86400e3);
  const npv = (r) => flows.reduce((s, f) => s + f.v / Math.pow(1 + r, yr(f.t)), 0);
  let lo = -0.99, hi = 50, flo = npv(lo), fhi = npv(hi);
  if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return null;
  for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2, fm = npv(mid); if (!isFinite(fm)) return null; if (Math.abs(fm) < 1e-6) return mid; if (flo * fm < 0) hi = mid; else { lo = mid; flo = fm; } }

}
async function vaultCmpCompute() {

  if (VCMP._p && VCMP._pKey === key) return VCMP._p;

    const hist = await vaultHistCompute();
    const sorted = vaultSorted(VAULT.rows);
    const first = hist.first, days = hist.pts.map((q) => isoDay(q.t));
    // fluxos em reais por dia (compra = aporte com a taxa; venda = resgate líquido da taxa)
    const flows = {};
    for (const e of sorted) { const { feeB } = vEntryFx(e); (flows[e.date] = flows[e.date] || []).push(e.type === 'buy' ? e.amount_brl + feeB : -(e.amount_brl - feeB)); }

    const carry = (map) => { const ks = Object.keys(map).sort(); let i = 0, last = null; const out = []; for (const d of days) { while (i < ks.length && ks[i] <= d) { if (isNum(map[ks[i]])) last = map[ks[i]]; i++; } out.push(last); } return out; };
    const fx = carry(fxm);
    const series = {}, errs = {};
    // dólar
    series.usd = fx;
    // bitcoin (Binance desde ago/2017)
    try { const k = await klinesSince('BTCUSDT', '1d', first - 3 * 86400e3); const b = carry(Object.fromEntries(k.map((x) => [isoDay(x.t), x.c]))); series.btc = b.map((v, i) => (isNum(v) && isNum(fx[i]) ? v * fx[i] : null)); } catch (e) { errs.btc = String(e.message || e); }
    // CDI: índice acumulado (a taxa do dia rende do dia para o seguinte)
    try {
      const m = await bcbSeries(12, first); const ks = Object.keys(m).sort();

      let I = 1, i = 0; while (i < ks.length && ks[i] < days[0]) i++;

      series.cdi = days.map((d) => { const v = I; while (i < ks.length && ks[i] <= d) { if (isNum(m[ks[i]])) I *= 1 + m[ks[i]] / 100; i++; } return v; });
    } catch (e) { errs.cdi = String(e.message || e); }
    // Ibovespa e S&P 500 (robô)
    try {
      const b = await getPipeline('bench', 4 * 86400e3);
      const toMap = (h) => (h && Array.isArray(h.d) ? Object.fromEntries(h.d.map((d, i) => [isoDay(d * 86400e3), h.c[i]])) : null);
      const ib = toMap(b && b.h && b.h['^BVSP']), sp = toMap(b && b.h && b.h['^GSPC']);

    const mineVal = hist.pts.map((q) => (isNum(q.vB) ? q.vB + (q.mB || 0) : null));
    const fl = []; let put = 0, took = 0;

    const end = [...mineVal].reverse().find(isNum);
    fl.push({ t: today, v: isNum(end) ? end : 0 });
    out.mine = { val: mineVal, put, took, end, res: isNum(end) ? end + took - put : null, xirr: xirr(fl), partial: hist.missing.length > 0 };

}

// Acha (1) erro de casa decimal (×1000: "1.432,17" gravado como 1,43217 pela versão antiga) e (2) preço fora da
// faixa do dia — inclusive o lançamento gravado com o preço do MOMENTO do cadastro (a versão antiga do formulário

// Nada muda sem a pessoa salvar.

function vaultSuspects() {
  const P = VAULT.dayPrices || {}, R = VAULT.dayRanges || {}; const out = [];
  for (const r of VAULT.rows) {
    if (!(r.qty > 0) || !(r.amount_usd > 0)) continue;
    const ref = P[r.asset_id] && P[r.asset_id][r.date]; if (!isNum(ref) || ref <= 0) continue;
    const rg = R[r.asset_id] && R[r.asset_id][r.date];
    const unit = r.amount_usd / r.qty, k = unit / ref;
    let kind = null, dev = 0;
    if (k > 250 && k < 4000) kind = 'qty';
    else if (k < 1 / 250 && k > 1 / 4000) kind = 'amt';
    // corretora brasileira cobra um pouco acima e o dólar do dia (PTAX) não é o da corretora: só passa de 12% fora da faixa
    else if (rg) { if (unit > rg[1] * 1.12) { kind = 'range'; dev = unit / rg[1] - 1; } else if (unit < rg[0] * 0.88) { kind = 'range'; dev = unit / rg[0] - 1; } }

    const nw = VCHK.now[r.id];
    const outDay = !!rg && (unit > rg[1] * 1.005 || unit < rg[0] * 0.995);
    if ((kind === 'range' || (!kind && outDay)) && nw && Math.abs(unit / nw.p - 1) < 0.015) { kind = 'now'; if (!dev && rg) dev = unit > rg[1] ? unit / rg[1] - 1 : unit / rg[0] - 1; }

// candidatos ao "preço do momento do cadastro": preço fora da faixa do dia e cadastrados 2+ dias depois da data da compra

    const rg = R[r.asset_id] && R[r.asset_id][r.date]; if (!rg || !(r.qty > 0) || !(r.amount_usd > 0) || VCHK.now[r.id] || r._nowTried) return false;

    return (u > rg[1] * 1.005 || u < rg[0] * 0.995) && r.created_at && r.binance_sym && VALID.has(r.binance_sym) && Date.parse(r.created_at) - Date.parse(r.date + 'T00:00:00Z') > 2 * 86400e3;

}

const _dayPx = {};
async function marketDay(coin, date) {
  if (!coin || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
  const key = (coin.s || coin.cg) + '|' + date; if (_dayPx[key]) return _dayPx[key];
  const t0 = Date.parse(date + 'T00:00:00Z');
  let r = null;

    if (coin.s && VALID.has(coin.s)) {
      const k = (await klines(coin.s, '1d', 1, { startTime: t0 }))[0];
      if (k && k.t === t0) r = { o: k.o, h: k.h, l: k.l, c: k.c, src: 'Binance' };
    }
    if (!r && coin.cg) {
      const pts = await cgDaily(coin.cg, t0 - 86400e3);
      const p = pts.find((x) => x.t === t0) || pts.find((x) => Math.abs(x.t - t0) <= 86400e3);
      if (p) r = { o: null, h: p.v, l: p.v, c: p.v, src: 'CoinGecko' };
    }

}

function priceCheck(unitUSD, day) {
  if (!isNum(unitUSD) || unitUSD <= 0 || !day) return null;
  const lo = Math.min(day.l, day.c), hi = Math.max(day.h, day.c), ref = day.c;

}

function parseVaultCsv(text) {
  const lines = text.replace(/^﻿/, '').split(/\r?\n/).filter((l) => l.trim());
  if (lines.length < 2) return [];
  const sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
  const split = (l) => { const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map((s) => s.trim()); };
  const head = split(lines[0]).map((h) => h.toLowerCase());
  const col = (re) => head.findIndex((h) => re.test(h));
  const ci = { d: col(/^data|date/), t: col(/^tipo|type/), a: col(/^ativo|asset|sym/), q: col(/^quant|qty/), u: col(/us\$|usd/), b: col(/r\$|brl/), f: col(/^taxa|fee/), e: col(/corretora|exchange/), n: col(/observa|note/) };
  const dec = (s) => { s = String(s || '').trim(); if (!s) return null; if (sep === ';') s = s.replace(/\./g, '').replace(',', '.'); return num(s); };
  return lines.slice(1).map((l) => {
    const c = split(l); const sym = (c[ci.a] || '').toUpperCase(); const u = BY_BASE[sym];
    let d = c[ci.d] || ''; const br = d.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (br) d = `${br[3]}-${br[2]}-${br[1]}`;
    return { date: d, type: /vend|sell/i.test(c[ci.t] || '') ? 'sell' : 'buy', asset_id: u ? u.cg : sym.toLowerCase(), sym, qty: dec(c[ci.q]), amount_usd: ci.u >= 0 ? dec(c[ci.u]) : null, amount_brl: ci.b >= 0 ? dec(c[ci.b]) : null, fee: ci.f >= 0 ? dec(c[ci.f]) : 0, exchange: ci.e >= 0 ? c[ci.e] : null, notes: ci.n >= 0 ? c[ci.n] : null, currency: ci.b >= 0 ? 'BRL' : 'USD' };
  });
}

// ---------- PAINEL DO ADMINISTRADOR ----------
const ADM = { q: '', users: [], claims: [], ov: null, err: '', pipe: null, robot: null, robotMissing: false, robotErr: '' };
async function admLoad() {
  ADM.err = '';
  try {
    const sb = await sbClient();
    const [ov, cl, us] = await Promise.all([sb.rpc('admin_overview'), sb.rpc('admin_list_claims', { p_status: 'pending' }), sb.rpc('admin_list_users', { p_search: ADM.q || null, p_limit: 100 })]);
    for (const r of [ov, cl, us]) if (r.error) throw r.error;
    ADM.ov = ov.data; ADM.claims = cl.data || []; ADM.users = us.data || [];
  } catch (e) { ADM.err = String(e.message || e); }
  // agendador do robô (migração 03): sem a função no banco, a tela explica como instalar
  try {
    const sb = await sbClient(); const { data, error } = await sb.rpc('admin_robot_status'); if (error) throw error;
    ADM.robot = data && typeof data === 'object' ? data : {}; ADM.robotMissing = false; ADM.robotErr = '';
  } catch (e) {
    const t = `${(e && e.code) || ''} ${(e && e.message) || e}`;
    ADM.robot = null; ADM.robotMissing = /PGRST202|Could not find the function|schema cache|\b404\b/i.test(t); ADM.robotErr = ADM.robotMissing ? '' : String((e && e.message) || e);
  }
  try { ADM.pipe = await getPipeline('status', 30 * 86400e3); } catch { ADM.pipe = null; }
  admDraw();
}
// resposta do GitHub ao último pedido do agendador, em português
function admGhMsg(last) {
  if (!last) return null;
  const s = num(last.status);
  if (s >= 200 && s < 300) return ['live', L('GitHub aceitou: robô disparado', 'GitHub accepted: bot started')];
  if (s === 401) return ['bad', L('token recusado (vencido, apagado ou copiado errado): crie outro', 'token rejected (expired, deleted or mistyped): create a new one')];
  if (s === 403) return ['bad', L('token sem permissão: precisa de "Actions: Read and write"', 'token lacks permission: needs "Actions: Read and write"')];
  if (s === 404) return ['bad', L('o token não tem acesso ao repositório Claude_crypto_hub7.0', 'the token has no access to the Claude_crypto_hub7.0 repository')];
  if (s === 422) return ['bad', L('o GitHub recusou o pedido (o robô ou o ramo main mudou)', 'GitHub refused the request (bot or main branch changed)')];
  if (s) return ['bad', 'HTTP ' + s];
  if (last.error) return ['bad', String(last.error).slice(0, 120)];
  return ['warn', L('aguardando a resposta do GitHub', 'waiting for GitHub’s answer')];
}
function admRobotHtml() {
  const ref = NX.supabaseUrl.split('//')[1].split('.')[0];

// BAIXAR O APP — o NEXUS HUB instala como aplicativo (PWA), igual ao Meu Caixa:
// Android e computador pelo pedido de instalação do navegador; iPhone pelo
// "Adicionar à Tela de Início". Abre em tela cheia, com ícone, e atualiza sozinho.
// =====================================================================
let INSTALL_EVT = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = () => /android/i.test(navigator.userAgent);
const isMobileUA = () => isIOS() || isAndroid();
const canInstall = () => !isStandalone() && (!!INSTALL_EVT || isMobileUA());
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); INSTALL_EVT = e; renderInstallUI(); });
window.addEventListener('appinstalled', () => {
  INSTALL_EVT = null; LS.set('installed', Date.now()); renderInstallUI();
  toast(L('NEXUS HUB instalado! O ícone está na sua tela inicial.', 'NEXUS HUB installed! The icon is on your home screen.'), { type: 'ok', ms: 7000 });
});
async function doInstall() {
  if (INSTALL_EVT) {
    const ev = INSTALL_EVT; INSTALL_EVT = null;
    ev.prompt();
    const r = await ev.userChoice.catch(() => null);
    if (!r || r.outcome !== 'accepted') INSTALL_EVT = null;
    renderInstallUI();
    return;
  }
  go('app');
}
ACT.install = () => doInstall();
ACT.installLater = () => { LS.set('install-later', Date.now()); renderInstallUI(); };
function renderInstallUI() {
  const b = $('#inst-btn');
  if (b) { const show = !isStandalone() && (!!INSTALL_EVT || isMobileUA()); b.hidden = !show; b.title = L('Baixar o app', 'Get the app'); b.setAttribute('aria-label', b.title); }
  const h = $('#d-install'); if (h) setHTML(h, installHint());
  if (S.page === 'app') drawAppPage();
}
// aviso no Dashboard (só no celular, some por 14 dias ao tocar em "Agora não")
function installHint() {
  if (!canInstall() || !isMobileUA()) return '';
  const t = LS.get('install-later', 0); if (t && Date.now() - t < 14 * 86400e3) return '';
  return `<div class="callout info" style="margin-bottom:14px">${ico('download', 18)}<span class="grow">${esc(L('Instale o app do NEXUS HUB: abre direto da tela inicial, em tela cheia, sem precisar entrar no site.', 'Install the NEXUS HUB app: opens from your home screen, full screen, no need to visit the site.'))}</span><span class="row" style="gap:6px;flex-shrink:0"><button class="btn sm pri" data-act="install">${esc(L('Instalar', 'Install'))}</button><button class="btn sm ghost" data-act="installLater">${esc(L('Agora não', 'Not now'))}</button></span></div>`;
}
