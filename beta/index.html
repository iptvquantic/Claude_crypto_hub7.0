// ---------- bibliotecas sob demanda ----------
const _libs = {};
function loadScript(lib) {
  if (window[lib.global]) return Promise.resolve(window[lib.global]);
  if (_libs[lib.global]) return _libs[lib.global];
  _libs[lib.global] = (async () => {
    let lastErr;
    for (const url of lib.urls) {
      try {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = url; s.async = true; s.crossOrigin = 'anonymous';
          if (lib.sri) s.integrity = lib.sri;
          const t = setTimeout(() => { s.remove(); rej(new Error('timeout')); }, 20000);
          s.onload = () => { clearTimeout(t); res(); };
          s.onerror = () => { clearTimeout(t); s.remove(); rej(new Error('falha ao carregar ' + hostOf(url))); };
          document.head.appendChild(s);
        });
        if (window[lib.global]) return window[lib.global];
      } catch (e) { lastErr = e; }
    }
    _libs[lib.global] = null;
    throw lastErr || new Error(L('biblioteca indisponível', 'library unavailable'));
  })();
  return _libs[lib.global];
}

// ---------- velas (klines) da Binance com cache curto ----------
const KL_TTL = { '1m': 15e3, '5m': 30e3, '15m': 60e3, '1h': 120e3, '4h': 300e3, '1d': 600e3, '1w': 3600e3, '1M': 3600e3 };
const _kl = new Map();
async function klines(sym, interval = '1d', limit = 500, { startTime, endTime } = {}) {
  const key = [sym, interval, limit, startTime || '', endTime || ''].join('|');
  const hit = _kl.get(key);
  if (hit && (hit.pending || Date.now() - hit.ts < (KL_TTL[interval] || 60e3))) return hit.p;
  const p = (async () => {
    let lastErr;
    for (const base of ['https://api.binance.com', 'https://data-api.binance.vision']) {
      try {
        const qs = new URLSearchParams({ symbol: sym, interval, limit: String(limit) });
        if (startTime) qs.set('startTime', String(startTime));
        if (endTime) qs.set('endTime', String(endTime));
        const a = await getJSON(`${base}/api/v3/klines?${qs}`, { timeout: 14000 });
        if (!Array.isArray(a)) throw new Error('klines');
        return a.map((k) => ({ t: k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4], v: +k[5], qv: +k[7], ct: k[6] }))
          .filter((k) => isNum(k.c) && k.c > 0);
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('binance');
  })();
  const rec = { p, ts: Date.now(), pending: true };
  _kl.set(key, rec);
  p.then(() => { rec.pending = false; rec.ts = Date.now(); }, () => _kl.delete(key));
  if (_kl.size > 120) _kl.delete(_kl.keys().next().value);
  return p;
}
// histórico longo (pagina de 1000 em 1000 velas a partir de uma data)
async function klinesSince(sym, interval, fromMs) {
  const out = [];
  let start = fromMs;
  for (let guard = 0; guard < 8; guard++) {
    const page = await klines(sym, interval, 1000, { startTime: start });
    if (!page.length) break;
    out.push(...page);
    if (page.length < 1000) break;
    start = page[page.length - 1].t + 1;
  }
  return out;
}

// ---------- indicadores ----------
function sma(vals, n) {
  const out = new Array(vals.length).fill(null); let s = 0;
  for (let i = 0; i < vals.length; i++) {
    s += vals[i]; if (i >= n) s -= vals[i - n];
    if (i >= n - 1) out[i] = s / n;
  }
  return out;
}
function ema(vals, n) {
  const out = new Array(vals.length).fill(null); const k = 2 / (n + 1); let e = null;
  for (let i = 0; i < vals.length; i++) {
    if (i === n - 1) e = avg(vals.slice(0, n));
    else if (i >= n) e = vals[i] * k + e * (1 - k);
    if (e !== null) out[i] = e;
  }
  return out;
}
function bollinger(vals, n = 20, mult = 2) {
  const mid = sma(vals, n), up = [], lo = [];
  for (let i = 0; i < vals.length; i++) {
    if (mid[i] === null) { up.push(null); lo.push(null); continue; }
    let s = 0; for (let j = i - n + 1; j <= i; j++) s += (vals[j] - mid[i]) ** 2;
    const sd = Math.sqrt(s / n);
    up.push(mid[i] + mult * sd); lo.push(mid[i] - mult * sd);
  }
  return { mid, up, lo };
}
// RSI de Wilder (o mesmo das corretoras)
function rsiSeries(closes, n = 14) {
  const out = new Array(closes.length).fill(null);
  if (closes.length <= n) return out;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const d = closes[i] - closes[i - 1]; if (d > 0) g += d; else l -= d; }
  let ag = g / n, al = l / n;
  out[n] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
  for (let i = n + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    ag = (ag * (n - 1) + Math.max(d, 0)) / n;
    al = (al * (n - 1) + Math.max(-d, 0)) / n;
    out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
  }
  return out;
}

function sparkSVG(vals, { w = 110, h = 28, color } = {}) {
  const v = (vals || []).filter(isNum);

  const step = w / (v.length - 1);
  const pts = v.map((x, i) => `${(i * step).toFixed(1)},${(h - 2 - ((x - mn) / r) * (h - 4)).toFixed(1)}`);
  const c = color || (v[v.length - 1] >= v[0] ? 'var(--up)' : 'var(--down)');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" width="100%" height="${h}" aria-hidden="true"><path d="M0,${h} L${pts.join(' L')} L${w},${h} Z" style="fill:${c};opacity:.12"/><polyline points="${pts.join(' ')}" style="fill:none;stroke:${c};stroke-width:1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
// velocímetro 0–100 (Fear & Greed)
function gaugeSVG(value) {
  const R = 80, cx = 100, cy = 100;
  const pt = (v) => { const a = Math.PI * (1 - v / 100); return [cx + R * Math.cos(a), cy - R * Math.sin(a)]; };
  const arc = (a, b, col) => { const [x1, y1] = pt(a), [x2, y2] = pt(b); return `<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 0 1 ${x2.toFixed(2)},${y2.toFixed(2)}" style="fill:none;stroke:${col};stroke-width:15;stroke-linecap:butt"/>`; };
  const bands = [[0, 24.4, fgColor(10)], [25.6, 44.4, fgColor(35)], [45.6, 54.4, fgColor(50)], [55.6, 74.4, fgColor(65)], [75.6, 100, fgColor(90)]];
  let s = `<svg class="fg-svg" viewBox="0 0 200 118" role="img" aria-label="${esc(L('Índice de medo e ganância', 'Fear and greed index'))}: ${isNum(value) ? value : '—'}">`;
  s += bands.map(([a, b, c]) => arc(a, b, c)).join('');
  if (isNum(value)) {
    const [nx, ny] = (() => { const a = Math.PI * (1 - clamp(value, 0, 100) / 100); return [cx + (R - 24) * Math.cos(a), cy - (R - 24) * Math.sin(a)]; })();
    const [mx, my] = pt(clamp(value, 0, 100));
    s += `<circle cx="${mx.toFixed(2)}" cy="${my.toFixed(2)}" r="9" style="fill:var(--panel);stroke:${fgColor(value)};stroke-width:4"/>`;
    s += `<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" style="stroke:var(--text);stroke-width:3.5;stroke-linecap:round"/><circle cx="${cx}" cy="${cy}" r="6.5" style="fill:var(--text)"/>`;
  }
  s += `<text x="16" y="116" style="fill:var(--text-3);font-size:10px">0</text><text x="178" y="116" style="fill:var(--text-3);font-size:10px">100</text></svg>`;
  return s;
}
// rosca (participações)
function donutSVG(parts, { size = 150, thick = 22, label = '' } = {}) {
  const tot = sum(parts.map((p) => Math.max(0, p.v || 0)));
  const R = (size - thick) / 2, C = 2 * Math.PI * R;
  let off = 0, segs = '';
  if (tot > 0) {
    for (const p of parts) {
      const frac = Math.max(0, p.v) / tot; if (frac <= 0) continue;
      const len = frac * C;
      segs += `<circle cx="${size / 2}" cy="${size / 2}" r="${R}" style="fill:none;stroke:${p.c};stroke-width:${thick}" stroke-dasharray="${Math.max(0, len - (parts.length > 1 ? 1.5 : 0)).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${size / 2} ${size / 2})"><title>${esc(p.t || '')}</title></circle>`;
      off += len;
    }
  } else segs = `<circle cx="${size / 2}" cy="${size / 2}" r="${R}" style="fill:none;stroke:var(--panel-3);stroke-width:${thick}"/>`;
  return `<svg class="donut" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)}">${segs}</svg>`;
}

function dashCards() {
  if (DASH.cards) return DASH.cards;
  let c = LS.get('dash-cards');
  if (!Array.isArray(c) || !c.length) {
    c = [];
    try { const old = JSON.parse(localStorage.getItem('nx-dash-syms') || 'null'); if (Array.isArray(old)) old.forEach((s) => { if (BY_SYM[s]) c.push({ k: 'b', s }); }); } catch { /* */ }
    try {
      const ex = JSON.parse(localStorage.getItem('nx-dash-extra') || 'null');
      if (Array.isArray(ex)) ex.forEach((x) => {
        const id = x && String(x.cgId || x.id || ''); if (!id) return;
        if (BY_CG[id]) c.push({ k: 'b', s: BY_CG[id].s });
        else c.push({ k: 'g', cg: id, b: String(x.sym || '').toUpperCase().slice(0, 12), n: String(x.name || id).slice(0, 40), logo: /^https:/.test(x.logo || '') ? x.logo : '' });
      });
    } catch { /* */ }
    if (!c.length) c = DASH_DEFAULT.map((s) => ({ k: 'b', s }));
  }
  const seen = new Set();
  DASH.cards = c.filter((x) => {
    if (!x) return false;
    const key = x.k === 'b' ? x.s : x.cg;
    if (!key || seen.has(key) || (x.k === 'b' && !BY_SYM[x.s])) return false;
    seen.add(key); return true;
  }).slice(0, 12);
  LS.set('dash-cards', DASH.cards);
  DASH.cards.forEach((x) => { if (x.k === 'g') trackExtra(x.cg); });
  return DASH.cards;
}

function registerDashSources() {
  const need = onPage('dash');

    id: 'stables', label: 'Stablecoins', provider: 'DefiLlama', every: 30 * 60e3, need,

      const top = a.map((x) => ({ s: x.symbol, v: x.circulating.peggedUSD })).sort((p, q) => q.v - p.v).slice(0, 3);
      return { total: f('circulating'), day: f('circulatingPrevDay'), week: f('circulatingPrevWeek'), month: f('circulatingPrevMonth'), top };
    },

    onData: () => _markDirty('STABLE'),
  });
  source({
    id: 'defi', label: 'DeFi', provider: 'CoinGecko', every: 30 * 60e3, need,

    run: async () => {
      const j = await getJSON('https://api.coingecko.com/api/v3/search/trending', { timeout: 12000 });

    },

  });

    id: 'rsi', label: 'RSI BTC/ETH', provider: 'Binance', every: 5 * 60e3, need, persist: true,
    run: async () => {
      const out = {};
      for (const [b, s] of [['BTC', 'BTCUSDT'], ['ETH', 'ETHUSDT']]) {
        out[b] = {};
        const tfs = await Promise.all(['1h', '4h', '1d', '1w'].map((tf) => klines(s, tf, 300)));
        ['1h', '4h', '1d', '1w'].forEach((tf, i) => { out[b][tf] = lastOf(rsiSeries(tfs[i].map((k) => k.c))); });
      }
      return out;
    },

    onData: () => _markDirty('RSI'),
  });
  source({
    id: 'monthly', label: L('Retornos mensais', 'Monthly returns'), provider: 'Binance', every: 60 * 60e3, need,
    run: async () => {
      const [b, e] = await Promise.all([klines('BTCUSDT', '1M', 120), klines('ETHUSDT', '1M', 120)]);
      const m = (a) => a.map((k) => ({ t: k.t, o: k.o, c: k.c }));
      return { BTC: m(b), ETH: m(e) };
    },
    validate: (d) => d.BTC.length > 12,
    onData: () => _markDirty('MONTHLY'),
  });
}

  for (const k of m.v[DASH.mr]) {

    const k = kl[i]; if (!k) return;
    const prev = kl[i - 1];

      `${L('Abr', 'O')} ${esc(fmtNum(k.o, ...priceDigits(k.o)))}`, `${L('Máx', 'H')} ${esc(fmtNum(k.h, ...priceDigits(k.h)))}`, `${L('Mín', 'L')} ${esc(fmtNum(k.l, ...priceDigits(k.l)))}`, `${L('Fch', 'C')} ${esc(fmtNum(k.c, ...priceDigits(k.c)))}`,
      prev ? `<span class="${tone(k.c - prev.c)}">${esc(fmtPct((k.c / prev.c - 1) * 100))}</span>` : ''];

}

function registerMarketSources() {

    need: () => ['markets', 'macro', 'agenda'].includes(S.page),
    run: async () => {
      // "ultimos/N" aceita no máximo 20 valores; a Selic (432) vem preenchida até a próxima reunião, então usa período
      const br = (t) => { const d = new Date(t); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; };
      const sgs = async (n, q) => {
        const a = await getJSON(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${n}/dados${q}${q.includes('?') ? '&' : '?'}formato=json`, { timeout: 12000 });

      };
      const [selic, cdi, ipca] = await Promise.all([
        sgs(432, `?dataInicial=${br(Date.now() - 400 * 86400e3)}&dataFinal=${br(Date.now() + 60 * 86400e3)}`),
        sgs(4389, '/ultimos/5'), sgs(13522, '/ultimos/13'),
      ]);
      const today = Date.now();
      const selicNow = [...selic].reverse().find((x) => x.d <= today + 12 * 3600e3) || selic[selic.length - 1];
      const selicPrev = [...selic].reverse().find((x) => x.v !== selicNow.v && x.d < selicNow.d);
      let focus = null;

        const j = await getJSON(`https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/ExpectativasMercadoAnuais?$top=30&$filter=${f}&$orderby=Data%20desc&$format=json&$select=Indicador,Data,DataReferencia,Mediana`, { timeout: 12000 });

        if (last) focus = { date: last, ipca: pick('IPCA', y), ipcaNext: pick('IPCA', y + 1), selic: pick('Selic', y), selicNext: pick('Selic', y + 1), y };
      } catch { /* Focus é complemento */ }

  });

function lastPt(a) { if (!a) return null; for (let i = a.length - 1; i >= 0; i--) if (isNum(a[i])) return { v: a[i], i }; return null; }
function rollMean(a, k) {

  for (let i = 0; i < n; i++) {
    if (isNum(a[i])) { s += a[i]; c++; }
    if (i >= k && isNum(a[i - k])) { s -= a[i - k]; c--; }
    if (i >= k - 1 && c === k) o[i] = s / k;
  }

}
const rollSum = (a, k) => rollMean(a, k).map((v) => (isNum(v) ? v * k : null));
function emaS(a, k) {
  const o = new Array(a.length).fill(null); const m = 2 / (k + 1); let e = null, s = 0, c = 0;
  for (let i = 0; i < a.length; i++) {
    const v = a[i]; if (!isNum(v)) continue;
    if (e === null) { s += v; c++; if (c === k) { e = s / k; o[i] = e; } } else { e = v * m + e * (1 - m); o[i] = e; }
  }

}

const mulA = (a, k) => a.map((v) => (isNum(v) ? v * k : null));

function hashRibbons(h30, h60, s10, s20) {
  const ev = []; let cap = -1;
  for (let i = 1; i < h30.length; i++) {
    const a = h30[i], b = h60[i], a0 = h30[i - 1], b0 = h60[i - 1];
    if (!isNum(a) || !isNum(b) || !isNum(a0) || !isNum(b0)) continue;
    if (a < b && a0 >= b0) cap = i;
    else if (a > b && a0 <= b0 && cap >= 0) {
      // capitulação de pelo menos 14 dias; compra quando o preço ganha força (média de 10 dias acima da de 20) em até 30 dias
      if (i - cap >= 14) { let buy = -1; for (let k = i; k < Math.min(h30.length, i + 30); k++) if (isNum(s10[k]) && isNum(s20[k]) && s10[k] > s20[k]) { buy = k; break; } ev.push({ cap, rec: i, buy }); }
      cap = -1;
    }
  }
  const lh = lastPt(h30);
  const capNow = lh && isNum(h60[lh.i]) && lh.v < h60[lh.i] ? cap : -1;
  return { ev, capNow, lastI: lh ? lh.i : -1 };
}
function labBuild(j, live) {

  const A = {};
  const p = g(cm.price); if (hasLive) p[N - 1] = live;
  A.p = p;

  A.ema147 = emaS(pf, 147);

function labFmt(f, v, axis) {
  if (!isNum(v)) return '—';
  switch (f) {
    case 'usd': return axis ? (Math.abs(v) >= 100 ? fmtNum(v, 0, 0) : fmtNum(v, 2, 2)) : usd(v, Math.abs(v) >= 100 ? [0, 0] : [2, 2]);
    case 'usdc': return fmtCompact(v, 'USD');
    case 'x3': return fmtNum(v, 3, 3);
    case 'rr': return fmtNum(v, 5, 5);
    case 'int': return fmtNum(v, 0, 0);
    case 'cmp': return fmtCompact(v, '');
    case 'eh': return fmtNum(v, 0, 0) + (axis ? '' : ' EH/s');
    case 'btc': return fmtNum(v, 0, 0) + (axis ? '' : ' BTC');
    case 'btcd': return fmtNum(v, 2, 2) + (axis ? '' : ' BTC');
    case 'btcs': return (v > 0 ? '+' : v < 0 ? '−' : '') + fmtNum(Math.abs(v), 0, 0) + (axis ? '' : ' BTC');
    default: return fmtNum(v, 2, 2);
  }
}

function labGetRange() { try { return LAB.charts[0].ch.timeScale().getVisibleLogicalRange(); } catch { return null; } }

function fedDecisions() {

  return FOMC.map((iso) => {
    const d = iso.slice(0, 10), t = Date.parse(iso);
    if (t > Date.now()) return { d, t, future: true };
    const next = new Date(t + 86400e3 * 3).toISOString().slice(0, 10);
    const before = at(d), after = at(next);
    if (!before || !after || after.d <= d) return { d, t, unknown: true };
    return { d, t, from: before, to: after, bp: Math.round((after.hi - before.hi) * 100) };
  });
}
function copomDecisions() {

  const a = h.v; const at = (ms) => { let r = null; for (const x of a) { if (x.t <= ms) r = x; else break; } return r; };
  return COPOM.map((iso) => {
    const t = Date.parse(iso), day = Date.parse(iso.slice(0, 10) + 'T12:00:00Z');
    if (t > Date.now()) return { d: iso.slice(0, 10), t, future: true };
    const before = at(day), after = at(day + 86400e3);
    if (!before || !after || after.t <= day) return { d: iso.slice(0, 10), t, unknown: true };
    return { d: iso.slice(0, 10), t, from: before.v, to: after.v, bp: Math.round((after.v - before.v) * 100) };
  });
}

  const date = String(x.date || '').slice(0, 10); if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;

    type: x.type === 'sell' ? 'sell' : 'buy', asset_id: asset.slice(0, 80), sym: String(x.sym || x.coinSym || (c && c.b) || asset).toUpperCase().slice(0, 15), name: String(x.name || (c && c.n) || x.coinSym || asset).slice(0, 60),

    date, qty, amount_usd: round2(isNum(usdv) ? usdv : brlv / fx), amount_brl: round2(isNum(brlv) ? brlv : usdv * fx), fx_brl: fx ? Math.round(fx * 1e6) / 1e6 : null,
    currency: x.currency === 'USD' ? 'USD' : 'BRL', fee: round2(Math.max(0, num(x.fee) || 0)), exchange: x.exchange ? String(x.exchange).slice(0, 40) : null, notes: x.notes ? String(x.notes).slice(0, 200) : null,

async function vaultBulk(rows, label) {
  rows = rows.filter(Boolean);
  if (!rows.length) { toast(L('Nenhum lançamento válido encontrado no arquivo.', 'No valid entry found in the file.'), { type: 'warn' }); return 0; }

  }

  return done;
}
ACT.vaultImport = () => {

function parseVaultCsv(text) {
  const lines = text.replace(/^﻿/, '').split(/\r?\n/).filter((l) => l.trim());
  if (lines.length < 2) return [];
  const sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
  const split = (l) => { const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map((s) => s.trim()); };
  const head = split(lines[0]).map((h) => h.toLowerCase());
  const col = (re) => head.findIndex((h) => re.test(h));
  const ci = { d: col(/^data|date/), t: col(/^tipo|type/), a: col(/^ativo|asset|sym/), q: col(/^quant|qty/), u: col(/us\$|usd/), b: col(/r\$|brl/), f: col(/^taxa|fee/), e: col(/corretora|exchange/), n: col(/observa|note/) };
  const dec = (s) => { s = String(s || '').trim(); if (!s) return null; if (sep === ';') s = s.replace(/\./g, '').replace(',', '.'); return num(s); };
  return lines.slice(1).map((l) => {
    const c = split(l); const sym = (c[ci.a] || '').toUpperCase(); const u = BY_BASE[sym];
    let d = c[ci.d] || ''; const br = d.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (br) d = `${br[3]}-${br[2]}-${br[1]}`;
    return { date: d, type: /vend|sell/i.test(c[ci.t] || '') ? 'sell' : 'buy', asset_id: u ? u.cg : sym.toLowerCase(), sym, qty: dec(c[ci.q]), amount_usd: ci.u >= 0 ? dec(c[ci.u]) : null, amount_brl: ci.b >= 0 ? dec(c[ci.b]) : null, fee: ci.f >= 0 ? dec(c[ci.f]) : 0, exchange: ci.e >= 0 ? c[ci.e] : null, notes: ci.n >= 0 ? c[ci.n] : null, currency: ci.b >= 0 ? 'BRL' : 'USD' };
  });
}

const ADM = { q: '', users: [], claims: [], ov: null, err: '', pipe: null };
async function admLoad() {
  ADM.err = '';
  try {
    const sb = await sbClient();
    const [ov, cl, us] = await Promise.all([sb.rpc('admin_overview'), sb.rpc('admin_list_claims', { p_status: 'pending' }), sb.rpc('admin_list_users', { p_search: ADM.q || null, p_limit: 100 })]);
    for (const r of [ov, cl, us]) if (r.error) throw r.error;
    ADM.ov = ov.data; ADM.claims = cl.data || []; ADM.users = us.data || [];
  } catch (e) { ADM.err = String(e.message || e); }
  try { ADM.pipe = await getPipeline('status', 30 * 86400e3); } catch { ADM.pipe = null; }
  admDraw();
}

  if (INSTALL_EVT) {

      L('Escolha <b>Adicionar à Tela de Início</b> e toque em <b>Adicionar</b>.', 'Choose <b>Add to Home Screen</b> and tap <b>Add</b>.')]],
    pc: [ico('monitor', 20), L('Computador', 'Computer'), [

  };

  box.innerHTML = `<section class="panel hero"><div class="row wrap between" style="gap:20px;align-items:center">

      [L('Sempre atualizado', 'Always up to date'), L('Não precisa baixar atualização: ao abrir com internet, ele já está na versão mais nova.', 'No updates to download: when opened online, it is already on the latest version.')],
      [L('Mesmos dados do site', 'Same data as the site'), L('Entre com a mesma conta e veja sua carteira no celular e no computador.', 'Sign in with the same account and see your portfolio on phone and computer.')],
      [L('Para remover', 'To remove'), L('Desinstale como qualquer app: segure o ícone e escolha Remover / Desinstalar.', 'Uninstall like any app: long-press the icon and choose Remove / Uninstall.')],
    ].map(([t, d]) => `<div class="li" style="align-items:flex-start">${ico('check', 18)}<span class="grow"><span class="t" style="display:block">${esc(t)}</span><span class="m" style="font-size:13px">${esc(d)}</span></span></div>`).join('')}</div></section>`;

// ---- 99-boot.js ----
// =====================================================================
// Faixa de cotações (ticker) e inicialização do app.
// A faixa mostra as principais moedas ao vivo e os destaques do Top 100 nas últimas 24 h
// (maiores altas e baixas, sem stablecoins). Ela rola sempre (o usuário pode parar em Configurações).
// =====================================================================
const TICK = { built: '', t: 0, rebuilt: 0 };
const TICK_MAJORS = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'BNBUSDT', 'XRPUSDT'];
const STABLE_CG = new Set(['tether', 'usd-coin', 'dai', 'first-digital-usd', 'ethena-usde', 'usds', 'paypal-usd', 'true-usd', 'frax', 'usdd', 'binance-usd', 'tether-gold', 'pax-gold', 'usd1-wlfi', 'ripple-usd', 'global-dollar', 'usdtb', 'falcon-finance', 'blackrock-usd-institutional-digital-liquidity-fund', 'ondo-us-dollar-yield', 'susds', 'ethena-staked-usde', 'eurc', 'gemini-dollar']);
function tickerMovers() {
  const c = CACHE.get('top100'); if (!c || !Array.isArray(c.v)) return { up: [], down: [] };
  const rows = c.v.filter((m) => !STABLE_CG.has(m.id) && !(m.current_price > 0.97 && m.current_price < 1.03 && Math.abs(num(m.price_change_percentage_7d_in_currency) || 0) < 1.5)).map((m) => {
    const u = BY_CG[m.id]; const live = u && PX[u.s];
    return { k: 'cg:' + m.id, cg: m.id, sym: (m.symbol || '').toUpperCase(), logo: m.image, n: m.name, p: live ? live.p : num(m.current_price), chg: live ? live.chg : num(m.price_change_percentage_24h_in_currency ?? m.price_change_percentage_24h), to: u ? { s: u.s } : null };
  }).filter((r) => isNum(r.chg) && isNum(r.p));
  rows.sort((a, b) => b.chg - a.chg);
  return { up: rows.slice(0, 8), down: rows.slice(-6).reverse() };
}
function tickerItems() {
  const items = [];
  for (const s of TICK_MAJORS) { const c = BY_SYM[s]; if (c && PX[s]) items.push({ k: s, logo: LOGOS[c.cg], c, sym: c.b, p: PX[s].p, chg: PX[s].chg, to: { s } }); }
  const mv = tickerMovers();
  if (mv.up.length) { items.push({ k: 'lbl:up', label: L('Maiores altas 24h', 'Top gainers 24h'), dir: 'up' }); mv.up.forEach((x) => items.push(x)); }
  if (mv.down.length) { items.push({ k: 'lbl:down', label: L('Maiores baixas 24h', 'Top losers 24h'), dir: 'down' }); mv.down.forEach((x) => items.push(x)); }
  if (!mv.up.length) liveCoins().filter((c) => PX[c.s] && !TICK_MAJORS.includes(c.s)).slice(0, 12).forEach((c) => items.push({ k: c.s, logo: LOGOS[c.cg], c, sym: c.b, p: PX[c.s].p, chg: PX[c.s].chg, to: { s: c.s } }));
  const r = brlRate();
  if (r) items.push({ k: 'USDBRL', sym: L('Dólar', 'USD/BRL'), txt: brl(r.v, [3, 3]), chg: FX.chg.usdbrl });
  if (METAL.xau) items.push({ k: 'XAU', sym: L('Ouro', 'Gold'), txt: usd(METAL.xau, [0, 0]) });
  if (METAL.xag) items.push({ k: 'XAG', sym: L('Prata', 'Silver'), txt: usd(METAL.xag, [2, 2]) });
  return items;
}
function tickItemHtml(x) {
  if (x.label) return `<span class="tk tk-lbl ${x.dir}" data-k="${esc(x.k)}">${ico(x.dir === 'up' ? 'trending-up' : 'trending-down', 15)}${esc(x.label)}</span>`;
  const logo = x.c ? coinLogo({ ...x.c, logo: x.logo }, 18) : x.cg ? coinLogo({ b: x.sym, logo: x.logo, cg: x.cg }, 18) : '';
  const link = x.to ? ` data-act="go" data-to="chart" data-params='${esc(JSON.stringify(x.to))}' role="link" tabindex="-1"` : x.cg ? ` data-act="go" data-to="top100" role="link" tabindex="-1"` : '';
  return `<span class="tk" data-k="${esc(x.k)}"${link}>${logo.replace('class="coin-logo"', 'class="coin-logo tk-logo"').replace('class="coin-fb"', 'class="coin-fb tk-logo"')}<span class="tk-sym">${esc(x.sym)}</span><span class="tk-p">${esc(x.txt || usd(x.p))}</span>${isNum(x.chg) ? `<span class="tk-c ${tone(x.chg)}">${esc(fmtPct(x.chg))}</span>` : ''}</span>`;
}
function buildTicker() {
  const tr = $('#tk-track'); if (!tr) return;
  const items = tickerItems(); if (items.length < 3) return;
  const sig = items.map((x) => x.k).join(',');
  if (sig === TICK.built) return;
  TICK.built = sig; TICK.rebuilt = Date.now();
  const one = items.map(tickItemHtml).join('');
  tr.innerHTML = one + one.replace(/data-act="go"/g, 'data-act="go" aria-hidden="true"'); // repetido para rolar sem emenda
  // velocidade constante (~55 px/s), qualquer que seja a quantidade de itens
  requestAnimationFrame(() => { const w = tr.scrollWidth / 2; tr.style.setProperty('--tk-dur', `${Math.max(30, Math.round(w / 55))}s`); });
}
function updTicker(set) {
  if (Date.now() - TICK.t < 1000) return; TICK.t = Date.now();
  const items = tickerItems();
  // reconstruir faz a faixa "pular": só quando a lista muda e no máximo a cada 3 min (ou se ainda não montou)
  const sig = items.map((x) => x.k).join(',');
  if (sig !== TICK.built && (!TICK.built || (sig.includes('lbl:up') && !TICK.built.includes('lbl:up')) || Date.now() - TICK.rebuilt > 180000)) buildTicker();
  const byK = Object.fromEntries(items.map((x) => [x.k, x]));
  $$('#tk-track .tk').forEach((el) => {
    const x = byK[el.dataset.k]; if (!x || x.label) return;
    if (x.c && set && !set.has(x.k) && !set.has('TOP100')) return;
    const p = el.querySelector('.tk-p'), c = el.querySelector('.tk-c');
    const txt = x.txt || usd(x.p); if (p && p.textContent !== txt) p.textContent = txt;
    if (c && isNum(x.chg)) { const t = fmtPct(x.chg); if (c.textContent !== t) c.textContent = t; c.className = 'tk-c ' + tone(x.chg); }
  });
}
function applyTickerMotion() { document.body.classList.toggle('tk-still', LS.get('tickerMotion', 'roll') === 'still'); }
onPrice((set) => { updTicker(set); updHeaderBtc(); });

// ---------- inicialização ----------
let _booted = false;
function hideBoot() { const b = $('#boot'); if (b && !b.classList.contains('hide')) { b.classList.add('hide'); setTimeout(() => b.remove(), 400); } }
function boot() {
  if (_booted) return; _booted = true;
  const lang = LS.get('lang'); S.lang = lang === 'en' ? 'en' : 'pt';
  document.documentElement.lang = S.lang === 'en' ? 'en' : 'pt-BR';
  $$('.lang-sw button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S.lang)));
  applyTheme(LS.get('theme', 'dark'));
  if (window.innerWidth > 900 && LS.get('sb-mini', false)) setSbMini(true); else setSbMini(false);
  if (LS.get('ticker', true) === false) document.body.classList.add('no-ticker');
  applyTickerMotion();
  buildHeaderLabels(); updClock();
  // fontes de dados
  registerPriceSources(); registerSharedSources(); registerDashSources(); registerTop100Sources(); registerMarketSources();
  registerOnchainSources(); registerLabSources(); registerEtfSources(); registerWhaleSources(); registerMacroSources(); registerNewsSources();
  buildSidebar();
  accountBoot();
  setTimeout(dbHeartbeat, 6000);
  renderInstallUI();
  if (isStandalone()) document.body.classList.add('standalone');
  // preços: foto imediata pelo REST e depois o WebSocket (pares conferidos)
  runSource('px-rest', { force: true }).then(() => { buildTicker(); hideBoot(); });
  validateUniverse().catch(() => {}).finally(() => wsStart());
  const { id, params } = parseHash(); showPage(id, params);
  setTimeout(hideBoot, 1500);
  // relógios
  setInterval(schedTick, 1000);
  setInterval(() => { updClock(); tickCountdowns(); }, 1000);
  setInterval(stampsRefresh, 5000);
  setInterval(wsWatchdog, 5000);
  setInterval(() => { if (!document.hidden) nxAudit(); }, 5 * 60e3);
  setTimeout(nxAudit, 20000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) return; refreshStale(); stampsRefresh(); if (!WSS.ok || Date.now() - WSS.last > 25000) wsStart(); });
  window.addEventListener('online', () => { toast(L('Conexão de volta. Atualizando…', 'Back online. Refreshing…'), { type: 'ok', ms: 2500 }); refreshStale(); wsStart(); });
  window.addEventListener('offline', () => toast(L('Sem internet: mostrando os últimos valores lidos, com o horário de cada um.', 'Offline: showing last values read, each with its time.'), { type: 'warn', ms: 6000 }));
  window.addEventListener('resize', debounce(() => { if (window.innerWidth <= 900) document.body.classList.remove('sb-mini'); else if (LS.get('sb-mini', false)) document.body.classList.add('sb-mini'); }, 200));
  // PWA (só nesta pasta; nunca guarda dados de mercado)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.addEventListener('error', (e) => { console.error('[NX] erro', e.message, e.filename, e.lineno); });
window.addEventListener('unhandledrejection', (e) => { console.warn('[NX] promessa sem tratamento', e.reason); });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
